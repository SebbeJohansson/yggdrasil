# A release, from a version tag: `git tag v0.2.0 && git push origin v0.2.0`,
# or "Run workflow" with a version (on GitHub, or Release on a project's page
# in the dashboard), which tags the commit it built (docs/releases.md). Tests
# first; then for amd64 and arm64 the bundle a machine installs
# (scripts/release-bundle.sh) and SHA256SUMS over both, the parts' image on
# ghcr.io for both, and a GitHub release holding the files.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.3.6 (becomes that tag)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sebbejohansson/yggdrasil
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="v${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              echo "::error::Tag $version already exists. Pick a new version."
              exit 1
            fi
          else
            version="$GITHUB_REF_NAME"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like v0.3.6 or v0.4.0-rc.1."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Bundles
        run: |
          for arch in amd64 arm64; do scripts/release-bundle.sh "$VERSION" "$arch" dist; done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          push: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-rc.1) is a prerelease, never "latest".
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Run by hand, the release makes the tag, on the commit built here.
          tag="--verify-tag"
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && tag="--target $GITHUB_SHA"
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            $tag --generate-notes --title "Yggdrasil $VERSION" $prerelease
