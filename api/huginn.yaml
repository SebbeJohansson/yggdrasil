openapi: 3.1.0
info:
  title: Huginn
  version: "1"
  description: |
    Reacts to what just happened, so you hear about it without asking:
    an important message, a meeting that just landed in the next hour, an
    alert that stops your agents, a Linear ticket in Todo that no goal has.
    It follows Norn's and Gjallar's event streams, looks at your Linear
    tickets through Sindri every 5 minutes, and runs a rule for each event
    that matches one. Time-based jobs
    belong to Dellingr. Any program that serves this contract and passes
    `ygg check huginn <url>` can replace the built-in one
    (docs/replacing-a-part.md).

    Rules a replacement must keep:
    - Suggest and tell, never act for you: no mail, messages, goals or
      agents started. It reads from Norn, Gjallar and Sindri and writes
      nowhere but Hermóðr (`POST /v1/messages`), its own rules and
      reactions. A suggested mute is made by the dashboard on Gjallar
      itself, never by Huginn.
    - Never ask Norn for raw inbox text. Work from the events' summaries and
      from `POST /v1/ask` on Norn, which keeps its own text to itself.
    - Every reaction goes to Hermóðr with the rule's `hold`, so Hermóðr
      keeps it while you are in a meeting. Urgent for an urgent message or a
      critical alert, high for a message from above you, normal otherwise.
    - A rule an agent creates (any caller but the owner) starts disabled,
      and only the owner can enable it.
    - Missed events are fetched again with `Last-Event-ID` after a
      reconnect. An event older than an hour is recorded, not delivered.
    - calendar.soon: a meeting starts within 30 minutes, told once per
      meeting and start. The built-in meeting-prep rule briefs on it, so
      every meeting gets a brief, not only one just added. The brief names
      who is invited. When the meeting's series is set to Claude (Norn's
      `/v1/meetings/prep`), a Claude agent writes it, in the Norn
      conversation the dashboard's meeting card reads, and Huginn waits up
      to ten minutes for it before telling you. A meeting that
      is added, moved and about to start is one thing to tell: a second
      rule of the same kind on it stays quiet.
    - draft.ready: Norn wrote a reply draft by itself for an inbox item.
      It matches on the item's relation, band, direct and mentionsMe like
      inbox.arrived, and links to the dashboard's inbox, where the draft is.
    - linear.todo: one of your Linear tickets is in Todo (state type
      unstarted), no goal has it (Sindri's `GET /v1/goals/candidates`), and
      Norn, asked with `/local`, says it is development work. Each ticket is
      judged once. Huginn only suggests: the goal is added by you.
    - savepoint.ready: a meeting ended, and Norn hands back what you were
      on when it started (its save point: the goal or your own Claude Code
      session, and your last prompt). The built-in save-point rule tells the
      widget only (never the phone, so the prompt does not reach ntfy), not
      held, titled "You were on: <title>", linking to the goal or session on
      the dashboard. Fields: title, meeting, prompt, project, branch, said.
    - promise.due: Norn's promise ledger says a promise you made is due
      the next working day (or today). The built-in promise-due rule says
      "You promised <who>: <what>, by <tomorrow>", links to the dashboard's
      promises, holds through meetings, priority normal, and says when a
      follow-up reply is drafted there. Every 5 minutes Huginn also asks
      Norn (with `/local`) whether each open promise not yet judged is
      development work, and keeps the answer on it with Norn's
      `PUT /v1/promises/{id}/dev`; the dashboard then offers to make it a
      goal. No goal is made for you.
    - weave.ready: Norn made the week's plan (its GET /v1/weave), once a
      week. The built-in week-plan rule tells the widget only (never the
      phone, `push: false`), not held, titled "The week's plan", with the
      week's line, linking to the plan on the dashboard. Fields: week, words.
    - A stream that stays down for 5 minutes is raised on Gjallar as
      `stream:<part>` (warning).
    - Learning your habits (`/v1/observations`, `/v1/suggestions`): the
      dashboard reports what you do, and what you do within
      `windowMinutes` (10) after an event is a pair. Five pairs of the same
      kind of event and action in 30 days, done after at least 70 % of
      those events, become a suggested rule; the same alert acknowledged,
      snoozed or muted five times (an hour apart) becomes a suggested
      Gjallar mute. Only kinds and ids are kept (page names, an alert's
      source and key, an event's kind with its relation, organizer and
      calendar), never a message's text, and only on this machine. A new
      suggestion is told through Hermóðr at most once a day, `push: false`
      and `hold: true`. A suggestion said no to is never made again.
    - Ratatoskr's gossip (`/v1/gossip`): a small chat where the parts talk
      about what happened to the system itself, in character, for fun. Only
      system events: Gjallar's alerts read by source and key (never their
      title, detail or link), Loki's finished strikes, merged goals and
      self-repair (never a goal's title), Dellingr's runs (never a job's
      name), Heimdall's findings by check. Never inbox, mail, Teams,
      meeting or calendar content, and no person's name. Written by the
      local model only, on this machine (`CHAT_URL` on loopback), never
      Claude; a line must be by a real part, at most 140 characters, with
      no link, address or key-like text, else a canned exchange is used. At
      most 3 exchanges an hour, 15 minutes apart, in working hours only; a
      burst folds into one exchange about at most 3 events. Nothing is sent
      to Hermóðr or anywhere else: it is a place you visit. The last 500
      lines are kept. On until turned off; off, it reads and writes nothing
      for it and `/v1/gossip` answers no lines.
servers:
  - url: http://127.0.0.1:8777
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Alive, and when each loop last ran.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      summary: This contract.
      security: []
      responses:
        "200":
          description: The spec.
          content:
            application/yaml: {}
  /v1/status:
    get:
      summary: Each stream Huginn follows, whether it is connected, and the last event from it.
      responses:
        "200":
          description: The streams.
          content:
            application/json:
              schema:
                type: object
                required: [streams]
                properties:
                  streams:
                    type: array
                    items:
                      type: object
                      required: [part, connected]
                      properties:
                        part: { type: string, enum: [norn, gjallar] }
                        connected: { type: boolean }
                        since: { type: string, format: date-time }
                        lastEventId: { type: string }
                        lastEventAt: { type: string, format: date-time }
                        error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/rules:
    get:
      summary: Every rule, the built-in ones first.
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: { type: array, items: { $ref: "#/components/schemas/Rule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: A new rule. Enabled when the owner makes it, disabled when anyone else does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/rules/{id}:
    patch:
      summary: Change a rule, or switch it on or off. Enabling is owner only. A built-in rule can only be switched on or off.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/RuleInput" }
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a rule. Built-in rules can't be removed, only switched off.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/observations:
    post:
      summary: What you just did on the dashboard, to learn from. Owner only. Dropped while learning is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  description: "open:<path> (kept as /dashboard/<page>, no ids), copy-draft, ack-alert, snooze-alert or mute-alert."
                target: { type: string, description: "The alert actions only: <source>:<key>." }
                at: { type: string, format: date-time, description: Defaults to now; at most a day ago. }
      responses:
        "204": { description: Kept. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/suggestions:
    get:
      summary: Rules and mutes Huginn suggests from what you do, waiting for you, newest first.
      responses:
        "200":
          description: The open suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/suggestions/{id}/accept:
    post:
      summary: >-
        Make it: a rule, enabled. For a mute, the caller mutes it on Gjallar
        itself (`POST /v1/mutes`) first, and accepting records it: Huginn
        never calls Gjallar with the owner's token. Owner only.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Made.
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion: { $ref: "#/components/schemas/Suggestion" }
                  rule: { $ref: "#/components/schemas/Rule" }
                  mute: { $ref: "#/components/schemas/Mute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/suggestions/{id}/reject:
    post:
      summary: No thanks. The same pattern is never suggested again. Owner only.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Said no to.
          content:
            application/json:
              schema:
                type: object
                required: [suggestion]
                properties:
                  suggestion: { $ref: "#/components/schemas/Suggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/settings/learning:
    get:
      summary: Whether Huginn learns from what you do, and how soon after an event it counts. On and 10 minutes until set.
      responses:
        "200": { $ref: "#/components/responses/LearnSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Turn learning on or off, or change the window. Off forgets every observation and event it kept. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                on: { type: boolean }
                windowMinutes: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "200": { $ref: "#/components/responses/LearnSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/gossip:
    get:
      summary: The parts' gossip about the system, oldest first. With since, the lines after that id (at most 200); without, the last 200. No lines while it is off.
      parameters:
        - { name: since, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The lines.
          content:
            application/json:
              schema:
                type: object
                required: [on, lines]
                properties:
                  on: { type: boolean }
                  lines: { type: array, items: { $ref: "#/components/schemas/GossipLine" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/gossip:
    get:
      summary: Whether the parts gossip. On until turned off.
      responses:
        "200": { $ref: "#/components/responses/GossipSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Turn the gossip on or off. Off reads nothing for it, writes nothing and drops what was waiting; the lines kept stay for when it is on again. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/GossipSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/reactions:
    get:
      summary: What Huginn did lately, newest first. Kept for 7 days. Hermóðr's messages are what the widget lists.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [delivered, failed, skipped] } }
      responses:
        "200":
          description: The reactions.
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions: { type: array, items: { $ref: "#/components/schemas/Reaction" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: The request doesn't make sense.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not yours to do.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such rule or suggestion.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The suggestion was already accepted or said no to.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LearnSetting:
      description: The learning setting.
      content:
        application/json:
          schema:
            type: object
            required: [on, windowMinutes]
            properties:
              on: { type: boolean }
              windowMinutes: { type: integer, minimum: 1, maximum: 60 }
    GossipSetting:
      description: The gossip setting.
      content:
        application/json:
          schema:
            type: object
            required: [on]
            properties:
              on: { type: boolean }
  schemas:
    GossipLine:
      type: object
      required: [id, exchange, at, speaker, name, text, about]
      properties:
        id: { type: integer, description: Rising; read on with since. }
        exchange: { type: string, description: The lines said together about the same events share it. }
        at: { type: string, format: date-time }
        speaker: { type: string, enum: [ratatoskr, loki, heimdall, sindri, gjallar, munin, huginn, norn, dellingr, hermodr, vedrfolnir] }
        name: { type: string, description: "The part's name as written: Veðrfölnir, Hermóðr…" }
        text: { type: string, maxLength: 140 }
        about: { type: array, items: { type: string }, description: The real events the exchange was about, in fixed words. }
        canned: { type: boolean, description: A canned line, used when the local model was down or answered junk. }
    Health:
      type: object
      required: [ok, part, version, startedAt, loops]
      properties:
        ok: { type: boolean }
        part: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        work: { type: boolean, description: "Set on a machine that holds work data (YGG_WORK=on): a widget elsewhere refuses to add it as a node." }
        loops:
          type: object
          description: Each loop the part runs on a timer. Ratatoskr counts a loop as stalled when it has not run within three intervals and a minute.
          additionalProperties:
            type: object
            required: [everySeconds]
            properties:
              everySeconds: { type: integer }
              lastRunAt: { type: string, format: date-time }
              lastError: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RuleInput:
      type: object
      required: [name, on, action]
      properties:
        name: { type: string, maxLength: 100 }
        on: { $ref: "#/components/schemas/Trigger" }
        action: { $ref: "#/components/schemas/Action" }
        deliver:
          type: array
          items: { type: string, enum: [phone, widget] }
          description: "Defaults to both. Without phone, Hermóðr lists it for the widget only (push: false)."
        hold: { type: boolean, description: Hermóðr waits until the meeting you are in ends. Defaults to true. }
    Rule:
      allOf:
        - { $ref: "#/components/schemas/RuleInput" }
      type: object
      required: [id, enabled, builtIn, createdBy, deliver, hold]
      properties:
        id: { type: string }
        enabled: { type: boolean }
        builtIn: { type: boolean, description: "Shipped with Huginn: important-message, urgent-message, meeting-prep, meeting-moved, alert-impact, calendar-duplicate, calendar-stale, linear-todo, save-point, promise-due, week-plan." }
        createdBy: { type: string, description: owner, or the name of the part or agent that made it. }
        lastFiredAt: { type: string, format: date-time }
        lastResult: { type: string, enum: [delivered, failed, skipped] }
    Trigger:
      type: object
      required: [event]
      description: Which event, and which of them. Every filter field given must match.
      properties:
        event:
          type: string
          enum: [inbox.arrived, draft.ready, calendar.soon, calendar.added, calendar.moved, calendar.removed, calendar.ended, calendar.duplicate, calendar.stale, alert.opened, alert.escalated, alert.resolved, linear.todo, savepoint.ready, promise.due, weave.ready]
        relation: { type: array, items: { type: string, enum: [manager, above, leadership, report, peer] }, description: inbox.arrived and draft.ready only. }
        band: { type: array, items: { type: string, enum: [urgent, notable] }, description: inbox.arrived and draft.ready only. }
        direct: { type: boolean, description: inbox.arrived and draft.ready only. }
        mentionsMe: { type: boolean, description: inbox.arrived and draft.ready only. }
        startsWithinMinutes: { type: integer, minimum: 1, maximum: 1440, description: calendar.* only. }
        calendar: { type: string, enum: [work, personal], description: calendar.* only. }
        severity: { type: array, items: { type: string, enum: [info, warning, critical] }, description: alert.* only. }
        source: { type: string, description: "alert.* only: the part that raised it." }
        organizer: { type: string, description: "calendar.* only: who organized the meeting, any case." }
        key: { type: string, description: "alert.* only: the alert's key." }
    Action:
      type: object
      required: [kind]
      description: |
        - notify: tell you `text`, with the event's fields filled in ({from},
          {summary}, {subject}, {start}, {title}…).
        - ask: send `text`, filled in the same way, to Norn's `POST /v1/ask`
          with `to: norn` and `/local ` in front, so Norn answers itself and
          never hands it to an agent, and deliver the answer. The meeting brief is this.
        - alert-impact: read Sindri's agents and tasks and say which ones the
          alert affects. alert.* only.
      properties:
        kind: { type: string, enum: [notify, ask, alert-impact] }
        text: { type: string, maxLength: 2000 }
        link: { type: string, maxLength: 200, description: "A dashboard path (/dashboard/meeting) the message links to, instead of the event's own link." }
    Reaction:
      type: object
      required: [id, ruleId, ruleName, event, eventAt, state, deliver, at]
      properties:
        id: { type: string }
        ruleId: { type: string }
        ruleName: { type: string }
        event: { type: string }
        eventAt: { type: string, format: date-time }
        state: { type: string, enum: [delivered, failed, skipped], description: "delivered: Hermóðr took it." }
        title: { type: string }
        text: { type: string, description: What was delivered, or will be. }
        link: { type: string }
        reason: { type: string, description: Why it failed or was skipped. }
        deliver: { type: array, items: { type: string, enum: [phone, widget] } }
        urgent: { type: boolean, description: Sent to Hermóðr as urgent, so never held. }
        at: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
    Mute:
      type: object
      required: [source, key]
      properties:
        source: { type: string }
        key: { type: string }
    Suggestion:
      type: object
      required: [id, pattern, kind, text, times, state, createdAt]
      properties:
        id: { type: string }
        pattern: { type: string, description: "The kind of event and the action, e.g. calendar.ended|organizer=anna berg -> open:/dashboard/meeting." }
        kind: { type: string, enum: [rule, mute] }
        text: { type: string, description: The suggestion in plain words. }
        rule: { $ref: "#/components/schemas/RuleInput", description: "kind rule: the rule accepting makes, delivered to the widget only." }
        mute: { $ref: "#/components/schemas/Mute", description: "kind mute: the Gjallar mute to make; the dashboard makes it, then accepts." }
        times: { type: integer, description: How many times you did it after such an event (rule), or quieted the alert (mute), in 30 days. }
        of: { type: integer, description: "kind rule: how many such events there were." }
        state: { type: string, enum: [open, accepted, rejected] }
        createdAt: { type: string, format: date-time }
        toldAt: { type: string, format: date-time, description: When Hermóðr was told of it. }
        decidedAt: { type: string, format: date-time }
        ruleId: { type: string, description: The rule accepting made. }
