openapi: 3.1.0
info:
  title: Ratatoskr
  version: "1"
  description: |
    Yggdrasil's watchdog. Checks that every part is alive and that its loops
    run on time. Fixes nothing. Any program that serves this contract and
    passes `ygg check ratatoskr <url>` can replace the built-in one
    (docs/replacing-a-part.md).

    Rules a replacement must keep:
    - Read every watched part's GET /health. Down after 2 failures in a row,
      up after 2 passes. Down raises `down:<part>` (critical) on Gjallar.
    - A loop on a part's /health that has not run within three of its
      intervals and a minute raises `stalled:<part>:<loop>` (warning). Loops
      of a part that is down are not checked.
    - Gjallar being down is never sent to Gjallar: tell Hermóðr, or push to
      the phone directly when Hermóðr can't take it, and report it here as
      gjallarUp false.
    - Beat to Gjallar (POST /v1/heartbeat) every minute.
    - Run outside the compose project.
    - Watching you (GET /v1/you) is never a fault: nothing about it goes to
      Gjallar. At most one message per pattern per day (the week: per
      week), through Hermóðr at priority low with hold, never during quiet
      hours, and with times only: no meeting subjects, no people.
servers:
  - url: http://127.0.0.1:8775
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Alive, and when each loop last ran.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      summary: This contract.
      security: []
      responses:
        "200":
          description: The spec.
          content:
            application/yaml: {}
  /v1/status:
    get:
      summary: Every watched part as last seen, and every check. The widget reads this directly, so it can say Gjallar is down without Gjallar.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [parts, checks, gjallarUp]
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      required: [name, url, up, checkedAt]
                      properties:
                        name: { type: string }
                        url: { type: string }
                        behind: { type: string, description: "The part whose proxy stands in front of this one (loki, from LOKI_PROXY). While it is down, this part is asked on its own port: answering, it is cut off, not down, and only the proxy is raised." }
                        up: { type: boolean }
                        error: { type: string }
                        health: { $ref: "#/components/schemas/Health" }
                        checkedAt: { type: string, format: date-time }
                  checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
                  gjallarUp: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/you:
    get:
      summary: >-
        Your own rhythm as last seen, for a widget to show on hover: a long run
        of meetings with no real gap (stretch), a session of yours still active
        late (late), most of the week's working hours in meetings (week). Each
        pattern is active or not, since when, and the next free time. A
        break you kept free (Norn's events with break true) is never a
        meeting, and ends a stretch like a real gap. A focus block you booked
        (focus true) is protected time: not a meeting, so it does not fill the
        week and is never named as its free time, but not time away from the
        screen either, so it does not end a stretch; it carries a run of
        meetings on (focus alone is no stretch). on is false while
        watching you is off (PATCH /v1/settings/you, else RATATOSKR_YOU).
      responses:
        "200":
          description: What it sees.
          content:
            application/json:
              schema:
                type: object
                required: [on, patterns]
                properties:
                  on: { type: boolean }
                  patterns:
                    type: array
                    items:
                      type: object
                      required: [name, active]
                      properties:
                        name: { type: string, enum: [stretch, late, week] }
                        active: { type: boolean }
                        since: { type: string, format: date-time }
                        nextGap: { type: string, format: date-time, description: "stretch: when the run of meetings ends. week: the longest free block of working hours still ahead." }
                        nextGapEnds: { type: string, format: date-time, description: "week: when that free block ends." }
                        toldAt: { type: string, format: date-time, description: "When you were told of it today (the week: this week)." }
                  checkedAt: { type: string, format: date-time }
                  errors: { type: array, items: { type: string }, description: "Sources it could not read last time." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/you:
    get:
      summary: Whether it is watching you. RATATOSKR_YOU until the owner sets it here; what is set outlives a restart.
      responses:
        "200": { $ref: "#/components/responses/YouSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: >-
        Turn watching you on or off. Off reads nothing and sends nothing, and
        GET /v1/you says on false with no patterns; on looks again at once.
        Kept across restarts. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/YouSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Only the owner may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    YouSetting:
      description: Watching you, on or off.
      content:
        application/json:
          schema:
            type: object
            required: [on]
            properties:
              on: { type: boolean }
  schemas:
    Health:
      type: object
      required: [ok, part, version, startedAt, loops]
      properties:
        ok: { type: boolean }
        part: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        loops:
          type: object
          description: Each loop the part runs on a timer. Ratatoskr counts a loop as stalled when it has not run within three intervals and a minute.
          additionalProperties:
            type: object
            required: [everySeconds]
            properties:
              everySeconds: { type: integer }
              lastRunAt: { type: string, format: date-time }
              lastError: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Check:
      type: object
      required: [key, down, fails, passes, since, checkedAt, raised]
      properties:
        key: { type: string }
        down: { type: boolean }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        detail: { type: string }
        fails: { type: integer }
        passes: { type: integer }
        since: { type: string, format: date-time }
        checkedAt: { type: string, format: date-time }
        raised: { type: boolean, description: Whether Gjallar holds an open alert for it. }
