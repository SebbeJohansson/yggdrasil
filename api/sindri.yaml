openapi: 3.1.0
info:
  title: Sindri
  version: "1"
  description: |
    Yggdrasil's coding orchestrator. Starts and tracks coding agents (Claude
    Code or GitHub Copilot CLI) in your repos, each in its own worktree, and
    reviews, checks, merges and publishes what they make. Any program that
    serves this contract and passes `ygg check sindri <url>` can replace the
    built-in one (docs/replacing-a-part.md).

    Rules a replacement must keep:
    - Agents work only inside the configured project roots.
    - A coding agent works in a worktree on its own branch, agent/<slug>,
      never in your checkout. Merging into your checkout is refused while
      either side has uncommitted work, and a conflict changes nothing.
    - Nothing is pushed or merged unless asked through these routes.
    - Switching an agent between Claude Code and Copilot happens only when
      asked (handoff), never on its own.
servers:
  - url: http://127.0.0.1:8772
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Alive, and when each loop last ran.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      summary: This contract.
      security: []
      responses:
        "200":
          description: The spec.
          content:
            application/yaml: {}
  /v1/agents:
    get:
      summary: Every agent, the most recently active first, without logs.
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start an agent. With worktree, it works on a new branch agent/<slug> cut from the repo's checked-out branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                cwd: { type: string, description: "A folder under the roots, or a project's name. Empty: where question agents run." }
                prompt: { type: string }
                label: { type: string }
                permissionMode: { type: string, enum: [default, acceptEdits, plan, auto] }
                model: { type: string }
                addRoots: { type: boolean }
                worktree: { type: boolean }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,59}$" }
                allowedTools: { type: array, maxItems: 150, items: { type: string } }
                disallowedTools: { type: array, maxItems: 150, items: { type: string } }
                noTools: { type: boolean }
                appendSystemPrompt: { type: string, maxLength: 8000 }
                engine: { type: string, enum: [claude, copilot, opencode], description: "opencode runs it as a session of the `opencode serve` at OPENCODE_URL." }
                session: { type: string, description: The Norn conversation the agent posts into. }
      responses:
        "201": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/agents/close-idle:
    post:
      summary: Make room when every slot is taken. Closes the waiting agent quiet the longest; its session stays resumable.
      responses:
        "200":
          description: The agent closed.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}:
    get:
      summary: One agent with its log, last result and pending permissions (with their input).
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema:
                allOf: [{ $ref: "#/components/schemas/Agent" }]
                type: object
                required: [log]
                properties:
                  log: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
                  result: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/prompt:
    post:
      summary: A follow-up. A finished session resumes. With queue, a busy turn is waited out instead of refused.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                images: { type: array, items: { type: string }, description: Paths /v1/uploads gave back for this agent. }
                queue: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/handoff:
    post:
      summary: A stopped agent carries on in the other CLI, same id and folder. Only when asked.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                to: { type: string, enum: [claude, copilot] }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/resume-scheduled:
    post:
      summary: Resume an agent parked after a Claude usage limit.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/label:
    post:
      summary: Rename an agent.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/permissions/{requestId}:
    post:
      summary: Allow or deny a tool call the agent is waiting on.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow: { type: boolean }
                message: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/abort:
    post:
      summary: Stop the agent's process.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/fix-conflicts:
    post:
      summary: Ask the agent to rebase its branch onto its base and resolve the conflicts.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/review:
    get:
      summary: The agent's branch, its commits, files and diff, with its screenshots. ?commit= for one commit.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: commit, in: query, schema: { type: string } }
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/screenshots/{name}:
    get:
      summary: A screenshot of the branch's changes, taken by an agent started when a turn ends.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The picture.
          content:
            image/png: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/checks:
    get:
      summary: The last result of each kind of check run in the agent's worktree.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: By kind.
          content:
            application/json:
              schema: { type: object, additionalProperties: { $ref: "#/components/schemas/Check" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Run a check (package.json's test or check script, or the workflows with act), or get this commit's result.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [script, workflows] }
                script: { type: string, enum: [test, check] }
                force: { type: boolean }
      responses:
        "200":
          description: The check, running or done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/merge:
    post:
      summary: Merge the agent's branch into the branch it was cut from, in your checkout.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/pull-request:
    post:
      summary: Push the agent's branch and open a GitHub pull request into its base, with gh.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/PullRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/push-base:
    post:
      summary: Push the branch the agent's work merged into to the remote it tracks.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/dismiss:
    post:
      summary: Forget a finished agent, and remove its worktree and branch when they hold no unmerged work. Refused while it runs or while its branch holds unmerged work.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/agents/{id}/remove-worktree:
    post:
      summary: Remove the agent's worktree, and its branch once merged. force discards unmerged work.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/uploads:
    post:
      summary: Files sent with a message, saved where that session reads them without asking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cwd, sessionId, files]
              properties:
                cwd: { type: string }
                sessionId: { type: string }
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    required: [name, data]
                    properties:
                      name: { type: string }
                      data: { type: string, description: Base64, at most 10 MB. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, path, bytes]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        bytes: { type: integer }
                        mediaType: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/Error" }
  /v1/worktrees:
    get:
      summary: Every worktree of every project, with the agent working in it when one does.
      responses:
        "200":
          description: The worktrees.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [project, repo, path, head, base, ahead, dirty, missing]
                  properties:
                    project: { type: string }
                    repo: { type: string }
                    path: { type: string }
                    branch: { type: string }
                    head: { type: string }
                    base: { type: string }
                    ahead: { type: integer }
                    dirty: { type: boolean }
                    missing: { type: boolean }
                    merged: { type: boolean }
                    checkout: { type: boolean, description: A branch in the project's own checkout, ahead of main. }
                    agent:
                      type: object
                      required: [id, label, status]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/worktrees/review:
    get:
      summary: The review of a worktree no agent owns.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: commit, in: query, schema: { type: string } }
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/worktrees/merge:
    post: { $ref: "#/components/x-unowned" }
  /v1/worktrees/remove:
    post: { $ref: "#/components/x-unowned" }
  /v1/worktrees/move:
    post: { $ref: "#/components/x-unowned" }
  /v1/worktrees/push-base:
    post: { $ref: "#/components/x-unowned" }
  /v1/worktrees/pull-request:
    post:
      summary: Push a worktree no agent owns and open a pull request.
      requestBody: { $ref: "#/components/requestBodies/Path" }
      responses:
        "200": { $ref: "#/components/responses/PullRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects:
    get:
      summary: The git repositories under the root.
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Make a new project (git init) under the root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{name}/docs:
    get:
      summary: The markdown files docs/docs.json lists, else README.md and TODO.md in the root. Read-only.
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                type: object
                required: [configured, files]
                properties:
                  configured: { type: boolean }
                  files:
                    type: array
                    items:
                      type: object
                      required: [file, title, content]
                      properties:
                        file: { type: string }
                        title: { type: [string, "null"] }
                        content: { type: [string, "null"] }
                        error: { type: string }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/work/code:
    post:
      summary: Hand a coding task over. One agent per project, each in a worktree, all on one branch name when there are several. A project with no room waits and starts when an agent finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, prompt, projects]
              properties:
                session: { type: string, description: The Norn conversation the agents post into. }
                prompt: { type: string, description: The task with its background, as Norn wrote it. }
                name: { type: string, description: The task in a few words. }
                projects: { type: array, minItems: 1, maxItems: 4, items: { type: string } }
                communication: { type: string, enum: [concise, detailed, verbose] }
                mode: { type: string, enum: [auto, manual] }
                goalId: { type: integer }
                goal: { type: string, description: What the ledger calls it, in your words. }
                engine: { type: string, enum: [claude, copilot, opencode], description: The engine the agents run on; empty is the coding-agent setting. }
      responses:
        "200":
          description: What was started, in words and by agent.
          content:
            application/json:
              schema:
                type: object
                required: [answer, parts, busy, failed]
                properties:
                  answer: { type: string }
                  parts: { type: array, items: { $ref: "#/components/schemas/Started" } }
                  busy: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/work/ask:
    post:
      summary: Hand a question that needs tools to a read-only question agent across every project, or follow up the conversation's own when it is settled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, prompt]
              properties:
                session: { type: string }
                prompt: { type: string }
                name: { type: string }
                communication: { type: string, enum: [concise, detailed, verbose] }
                mode: { type: string, enum: [auto, manual] }
                agent: { type: string, description: The conversation's question agent, to follow up. }
                followUp: { type: string, description: What it is sent when followed up. }
                goal: { type: string }
                noTools: { type: boolean, description: "Start it with no tools and no MCP servers: it answers from the prompt alone (Norn's meeting briefs)." }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/work/reply:
    post:
      summary: Your words to an agent that has stopped. 409 while it works or waits on a tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, text]
              properties:
                session: { type: string }
                agent: { type: string }
                text: { type: string }
                images: { type: array, items: { type: string } }
                communication: { type: string, enum: [concise, detailed, verbose] }
                mode: { type: string, enum: [auto, manual] }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/work/part:
    post:
      summary: Add another project's part to a conversation's code task, on the same branch name. The agent's own task first, else the conversation's latest code task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, project, task]
              properties:
                session: { type: string }
                agent: { type: string, description: The conversation's own agent. }
                project: { type: string }
                task: { type: string }
      responses:
        "200":
          description: What was started.
          content:
            application/json:
              schema:
                type: object
                required: [answer]
                properties:
                  answer: { type: string }
                  parts: { type: array, items: { type: object } }
                  busy: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/work/tell:
    post:
      summary: Pass a message to an agent, after its current turn if it is busy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent, text]
              properties:
                agent: { type: string }
                text: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tasks:
    get:
      summary: The task ledger. Every task started since then (a day by default, a year at most), or still open, with its live status.
      parameters:
        - { name: since, in: query, schema: { type: integer, description: Epoch ms. } }
      responses:
        "200":
          description: The tasks, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/TaskView" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auto-allowed:
    get:
      summary: The tool calls Sindri allowed on your behalf (everyday reads, tests and git reads in the agent's own folder), newest first.
      parameters:
        - { name: since, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Whether automatic approvals are on, and the calls (a day back by default).
          content:
            application/json:
              schema:
                type: object
                required: [enabled, calls]
                properties:
                  enabled: { type: boolean }
                  calls:
                    type: array
                    items:
                      type: object
                      required: [id, at, agent, taskId, tool, summary, rule]
                      properties:
                        id: { type: integer }
                        at: { type: integer }
                        agent: { type: string }
                        taskId: { type: [integer, "null"] }
                        tool: { type: string }
                        summary: { type: string }
                        rule: { type: string, enum: [read, tests, git read] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/coding-agent:
    get:
      summary: The CLI new agents run on. Switching an agent between them happens only by hand.
      responses:
        "200": { $ref: "#/components/responses/CodingAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Choose it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodingAgent" }
      responses:
        "200": { $ref: "#/components/responses/CodingAgent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/automation:
    get:
      summary: What Sindri does on its own. autoAllow answers everyday tool calls; followThrough sends failed tests back once.
      responses:
        "200": { $ref: "#/components/responses/Automation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Switch them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoAllow: { type: boolean }
                followThrough: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Automation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/night-shift:
    get:
      summary: The night shift's times, HH:MM in Sindri's TIME_ZONE. Goals marked night start from start; a report of them goes to Hermóðr at report.
      responses:
        "200": { $ref: "#/components/responses/NightShift" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Change them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "22:00" }
                report: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "07:00" }
      responses:
        "200": { $ref: "#/components/responses/NightShift" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/self-repair:
    get:
      summary: >-
        Self-repair: at the night shift's start, Sindri drafts goals in the yggdrasil repo, marked to run tonight and with a
        source starting `self-repair:`, for Gjallar's active alerts about Yggdrasil's own parts and for Norn's dispatch picks
        you corrected the same way at least 3 times in a week (only kinds, agent ids, projects and counts, never message text).
        No new goal while one for the same alert or correction is open, at most perNight a night. The morning report sorts them
        into fixed, not sure and left alone. Nothing is merged on its own. Off unless SINDRI_SELF_REPAIR=on or the owner turns it on.
      responses:
        "200": { $ref: "#/components/responses/SelfRepair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Turn it on or off, or change how many goals a night it drafts at most. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                on: { type: boolean }
                perNight: { type: integer, minimum: 0, maximum: 10 }
      responses:
        "200": { $ref: "#/components/responses/SelfRepair" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/settings/why:
    get:
      summary: >-
        Whether a goal's coding agents get the why: when they start, Sindri asks Norn's POST /v1/why for the mail, meetings
        and Rewind moments behind the goal (summarized by Norn's local model, names as placeholders) and puts them in the
        prompt under "Why this goal exists". At most SINDRI_WHY_TIMEOUT (30s) is waited; without an answer the agents start
        without it. On until the owner turns it off; off, Norn is not asked.
      responses:
        "200": { $ref: "#/components/responses/WhySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Turn it on or off. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/WhySettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/goals:
    get:
      summary: Every goal, newest first, with its state and next step read from its tasks.
      responses:
        "200":
          description: The goals.
          content:
            application/json:
              schema:
                type: object
                required: [goals]
                properties:
                  goals: { type: array, items: { $ref: "#/components/schemas/Goal" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: A new goal, as a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                repos: { type: array, maxItems: 4, items: { type: string } }
                source: { type: string, description: "manual, todo:<repo>:<line>, linear:<id>" }
                context: { type: string, maxLength: 20000 }
      responses:
        "201": { $ref: "#/components/responses/Goal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/goals/{id}/race:
    put:
      summary: Mark a draft goal to race at the night shift, or unmark it. It then starts once on each conduit of the race pair, each in its own worktree and branch. Owner only.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [race]
              properties:
                race: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Goal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/conduit:
    put:
      summary: The conduit a goal runs on when it starts as usual (not raced). Empty is Sindri's default. A goal's suggestion only shows it; this is where you choose.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conduit]
              properties:
                conduit: { type: string, enum: ["", claude, opencode, copilot] }
      responses:
        "200": { $ref: "#/components/responses/Goal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/race/pick:
    post:
      summary: Pick the winner of a race whose lanes have both finished. The winner's branches merge through the usual merge (merge false keeps them to review); the loser's worktrees and branches are removed. neither removes both and closes the goal. The pick is kept with the goal's kind. Owner only.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winner]
              properties:
                winner: { type: string, description: "A conduit of the race, or neither." }
                merge: { type: boolean, default: true }
      responses:
        "200":
          description: The goal, the pick, and what happened to each branch.
          content:
            application/json:
              schema:
                type: object
                required: [goal, pick, merged, discarded, failed]
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
                  pick: { $ref: "#/components/schemas/RacePick" }
                  merged: { type: array, items: { type: string } }
                  discarded: { type: array, items: { type: string } }
                  failed: { type: array, items: { type: string }, description: Branches that could not be merged or removed; they stay. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/races:
    get:
      summary: Every goal that raced, newest first, with its lanes.
      responses:
        "200":
          description: The races.
          content:
            application/json:
              schema:
                type: object
                required: [races]
                properties:
                  races: { type: array, items: { $ref: "#/components/schemas/Goal" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/races/stats:
    get:
      summary: Wins per kind per conduit, from every pick.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [conduits, kinds, picks, minPicks]
                properties:
                  conduits: { type: array, items: { type: string } }
                  picks: { type: integer }
                  minPicks: { type: integer, description: How many picks with a winner a kind needs before a winner is suggested for it. }
                  kinds:
                    type: array
                    items:
                      type: object
                      required: [kind, picks, neither, wins, raced]
                      properties:
                        kind: { type: string }
                        picks: { type: integer }
                        neither: { type: integer }
                        wins: { type: object, additionalProperties: { type: integer } }
                        raced: { type: object, additionalProperties: { type: integer } }
                        suggested: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/races:
    get:
      summary: Which two conduits race, how many picks a kind needs before a winner is suggested, and which conduits are up.
      responses:
        "200": { $ref: "#/components/responses/Races" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Change them. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pair: { type: array, minItems: 2, maxItems: 2, items: { type: string, enum: [claude, opencode, copilot] } }
                minPicks: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Races" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    get:
      summary: Every coding-agent session on this machine, each source on its own. Claude Code's running sessions (registry and live sockets), OpenCode's (a running opencode serve), and herdr's panes. A source that is off or down has sessions null and says why.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [claude, opencode, herdr, at]
                properties:
                  claude:
                    allOf:
                      - { $ref: "#/components/schemas/SessionSource" }
                      - type: object
                        required: [degraded]
                        properties:
                          degraded: { type: boolean, description: No socket directory, so liveness is a guess from recent activity. }
                  opencode: { $ref: "#/components/schemas/SessionSource" }
                  herdr: { $ref: "#/components/schemas/SessionSource" }
                  at: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/sessions/recent:
    get:
      summary: Your own Claude Code sessions from the last day, newest first, read from their transcripts. Sindri's agents are left out.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, path, title, lastActivity, working]
                  properties:
                    id: { type: string }
                    path: { type: string, description: The transcript. }
                    title: { type: string }
                    cwd: { type: string }
                    project: { type: string }
                    branch: { type: string, description: The git branch the session last worked on, when the transcript says. }
                    lastActivity: { type: integer }
                    lastPrompt: { type: string }
                    lastText: { type: string }
                    working: { type: boolean, description: Changed in the last two minutes and the turn has not ended. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/sessions/prompts:
    get:
      summary: >-
        Your own prompts in your Claude Code sessions in a range, oldest first,
        for Norn's Rewind. Read from Sindri's index (session_prompts in its
        store), which a loop fills every 3 minutes from new transcript lines,
        and on start from every transcript still on disk, so prompts outlive
        Claude Code's cleanup of old transcripts. Only what you typed, clipped
        to 200 characters, with its time, session, title, folder and branch;
        never Claude's answers. Sindri's own agents are left out. Kept forever
        unless SINDRI_PROMPTS_KEEP (a duration) is set. At most 5000 a call.
      parameters:
        - { name: from, in: query, required: false, schema: { type: integer, minimum: 0 }, description: "Epoch ms; a day ago by default." }
        - { name: to, in: query, required: false, schema: { type: integer, minimum: 0 }, description: "Epoch ms, not included; now by default. At most 93 days after from." }
      responses:
        "200":
          description: The prompts.
          content:
            application/json:
              schema:
                type: object
                required: [prompts, oldest]
                properties:
                  prompts:
                    type: array
                    items:
                      type: object
                      required: [at, session, title, prompt]
                      properties:
                        at: { type: integer, description: The transcript line's timestamp, epoch ms. }
                        session: { type: string }
                        title: { type: string, description: Claude's title for the session, else your first prompt. }
                        cwd: { type: string }
                        project: { type: string }
                        branch: { type: string }
                        prompt: { type: string }
                  oldest: { type: [integer, "null"], description: The oldest prompt the index holds; null when empty. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/sessions/opencode/permissions/{id}:
    post:
      summary: Allow once, or reject, a permission an OpenCode session asks for.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow: { type: boolean }
      responses:
        "200":
          description: Answered.
          content:
            application/json:
              schema: { type: object, required: [answered], properties: { answered: { type: boolean } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sessions/herdr:
    post:
      summary: Start an agent in a new, unfocused herdr workspace. With resume, it picks up that session instead, which is how a session started elsewhere is taken over into herdr.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, cwd]
              properties:
                kind: { type: string, description: "claude, opencode, codex…" }
                cwd: { type: string, description: An absolute path. }
                name: { type: string }
                resume: { type: string, description: A session id to resume (claude or opencode). }
      responses:
        "200":
          description: The agent, ready for input.
          content:
            application/json:
              schema: { type: object, required: [agent], properties: { agent: { $ref: "#/components/schemas/HerdrAgent" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sessions/herdr/{target}/prompt:
    post:
      summary: Type a prompt into the agent's pane and press Enter. Refused (agent_blocked) while a dialog shows.
      parameters:
        - { name: target, in: path, required: true, schema: { type: string }, description: "An agent's herdr name, or its pane's id (w1:p2)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string } } }
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { type: object, required: [agent], properties: { agent: { $ref: "#/components/schemas/HerdrAgent" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sessions/herdr/{target}/keys:
    post:
      summary: Press keys in the agent's pane (enter, esc, 1, ctrl+c…).
      parameters:
        - { name: target, in: path, required: true, schema: { type: string }, description: "An agent's herdr name, or its pane's id (w1:p2)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [keys], properties: { keys: { type: array, minItems: 1, items: { type: string } } } }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, required: [sent], properties: { sent: { type: array, items: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sessions/herdr/{target}/choose:
    post:
      summary: Pick a choice in the pane's dialog, only while that same dialog is on screen; dialog_changed (409) when it has moved on, and nothing is pressed.
      parameters:
        - { name: target, in: path, required: true, schema: { type: string }, description: "An agent's herdr name, or its pane's id (w1:p2)." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, key, label]
              properties:
                question: { type: string }
                key: { type: string }
                label: { type: string }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { type: object, required: [sent], properties: { sent: { type: array, items: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/sessions/herdr/{target}/read:
    get:
      summary: The pane's recent output as plain text.
      parameters:
        - { name: target, in: path, required: true, schema: { type: string }, description: "An agent's herdr name, or its pane's id (w1:p2)." }
        - { name: lines, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 120 } }
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema: { type: object, required: [text], properties: { text: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/cloud:
    get:
      summary: The cloud sessions (Claude Code on the web) started here, newest first. Anthropic lists no others, so these are all Sindri knows.
      responses:
        "200":
          description: The sessions; `off` says why there are none to start.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/CloudSession" } }
                  off: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Start a cloud session for the repo at `cwd` (its GitHub remote, its current branch) with `claude --cloud "<task>"`, and wait for its link. Owner or Sága only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cwd, task]
              properties:
                cwd: { type: string, description: The repo's absolute path. }
                task: { type: string }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { type: object, required: [session], properties: { session: { $ref: "#/components/schemas/CloudSession" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/cloud/{id}/message:
    post:
      summary: Queue a message in a cloud session started here (`claude -p "<text>" --cloud <id>`). Owner or Sága only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "The session's id (session_…)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string } } }
      responses:
        "200":
          description: Queued.
          content:
            application/json:
              schema: { type: object, required: [session], properties: { session: { $ref: "#/components/schemas/CloudSession" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/cloud/{id}/teleport:
    post:
      summary: Bring a cloud session home with `claude --teleport <id>` in a new herdr pane in its repo. The repo must be clean and the session's branch pushed. Owner or Sága only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The pane it runs in.
          content:
            application/json:
              schema:
                type: object
                required: [session, agent]
                properties:
                  session: { $ref: "#/components/schemas/CloudSession" }
                  agent: { $ref: "#/components/schemas/HerdrAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /v1/cloud/{id}:
    delete:
      summary: Forget a cloud session. It goes on at claude.ai; it only leaves this list. Owner or Sága only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Forgotten.
          content:
            application/json:
              schema: { type: object, required: [forgotten], properties: { forgotten: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/activity:
    get:
      summary: Per day, sessions started, agents started and branches merged.
      parameters:
        - { name: tz, in: query, schema: { type: string }, description: An IANA time zone; the machine's by default. }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 800, default: 365 } }
      responses:
        "200":
          description: The days, keyed 2026-11-15.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  required: [sessions, agents, merges]
                  properties:
                    sessions: { type: integer }
                    agents: { type: integer }
                    merges: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/goals/merged:
    get:
      summary: Every goal Sindri has seen merged, the earliest merged first, as it was then. Never pruned; a goal stays here after its agent is removed or the goal is deleted. The widget's tree grows a branch for each.
      responses:
        "200":
          description: The merged goals.
          content:
            application/json:
              schema:
                type: object
                required: [goals]
                properties:
                  goals:
                    type: array
                    items:
                      type: object
                      required: [id, title, repos, mergedAt]
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        repos: { type: array, items: { type: string } }
                        mergedAt: { type: integer, description: "Unix ms: its last branch's merge, or its last activity for a branch merged outside Sindri." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/goals/candidates:
    get:
      summary: The open "- [ ]" lines of a project's TODO.md, or your open Linear issues, each ready to post as a goal. A goal from Linear moves its issue along as the goal moves.
      parameters:
        - { name: from, in: query, required: true, example: todo, schema: { type: string, enum: [todo, linear] } }
        - { name: project, in: query, example: demo, schema: { type: string }, description: "todo: the project (required). linear: part of a Linear project's name." }
        - { name: query, in: query, schema: { type: string }, description: "linear: part of the title." }
        - { name: assignee, in: query, schema: { type: string, enum: [mine, unassigned, all] }, description: "linear: whose issues; mine by default." }
      responses:
        "200":
          description: The candidates.
          content:
            application/json:
              schema:
                type: object
                required: [from, candidates]
                properties:
                  from: { type: string }
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [source, title, context, repos]
                      properties:
                        source: { type: string }
                        title: { type: string }
                        context: { type: string }
                        repos: { type: array, items: { type: string } }
                        url: { type: string }
                        goal: { type: integer, description: The goal that already has this source. }
                        state: { type: string, description: "linear: the issue's state, e.g. Todo." }
                        stateType: { type: string, description: "linear: triage, backlog, unstarted, started, completed or canceled." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}:
    patch:
      summary: Change a goal's title, repos or context, and its agents are told to read it again; or mark it to start tonight (night).
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                repos: { type: array, items: { type: string } }
                context: { type: string }
                night: { type: boolean, description: Start this draft on its own tonight, in the night shift. }
      responses:
        "200": { $ref: "#/components/responses/Goal" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the goal record only. Its tasks and agents stay.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/start:
    post:
      summary: One coding agent per repo that has none yet, on one branch name.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repos: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/GoalStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/parts/{repo}/restart:
    post:
      summary: Start a fresh agent for one repo of the goal, in place of its part. The old worktree is removed when it holds no work; one with work stays to review.
      parameters:
        - { $ref: "#/components/parameters/GoalID" }
        - { name: repo, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/GoalStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/relook:
    post:
      summary: Tell each part's newest agent to read the goal again. A removed worktree is made again first, on its branch; a part whose agent is gone starts again with a fresh agent.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      responses:
        "200": { $ref: "#/components/responses/GoalStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/resume:
    post:
      summary: Make the goal's parts waiting for Claude usage due now and start a pass over the agents, so they resume without waiting for their next try.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      responses:
        "200":
          description: The goal, and how many of its parts were made due.
          content:
            application/json:
              schema:
                type: object
                required: [goal, due]
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
                  due: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/close:
    post:
      summary: Close the goal without merging the rest. Each branch of it with no commit past its base and nothing uncommitted is removed with its worktree; branches with work stay.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      responses:
        "200":
          description: The closed goal, and what happened to each unmerged branch.
          content:
            application/json:
              schema:
                type: object
                required: [goal, branches]
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
                  branches:
                    type: array
                    items:
                      type: object
                      required: [repo, branch, removed]
                      properties:
                        repo: { type: string }
                        branch: { type: string }
                        removed: { type: boolean }
                        why: { type: string, description: Why the branch stayed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/reopen:
    post:
      summary: Open a closed goal again. Removed branches stay removed.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      responses:
        "200": { $ref: "#/components/responses/Goal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/images:
    post:
      summary: A picture for the goal. design is how it should look; current is how it looks now.
      parameters: [{ $ref: "#/components/parameters/GoalID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, data]
              properties:
                name: { type: string }
                data: { type: string, description: Base64, png, jpg, gif or webp, at most 10 MB. }
                kind: { type: string, enum: [design, current] }
                note: { type: string, maxLength: 500 }
      responses:
        "201": { $ref: "#/components/responses/GoalImage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/goals/{id}/images/{imageId}:
    get:
      summary: The picture's bytes.
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/ImageID" }]
      responses:
        "200": { description: The picture., content: { image/png: {} } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change a picture's kind or note.
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/ImageID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [design, current] }
                note: { type: string }
      responses:
        "200": { $ref: "#/components/responses/GoalImage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a picture.
      parameters: [{ $ref: "#/components/parameters/GoalID" }, { $ref: "#/components/parameters/ImageID" }]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    GoalID:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ImageID:
      name: imageId
      in: path
      required: true
      schema: { type: integer }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    Path:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path: { type: string }
              force: { type: boolean, description: For remove, discard unmerged work. }
  x-unowned:
    summary: Merge, remove, move into a worktree, or push the base of a worktree no agent owns.
    requestBody: { $ref: "#/components/requestBodies/Path" }
    responses:
      "200": { $ref: "#/components/responses/Done" }
      "400": { $ref: "#/components/responses/Error" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "404": { $ref: "#/components/responses/Error" }
      "409": { $ref: "#/components/responses/Error" }
  responses:
    OK:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
    CodingAgent:
      description: The setting.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CodingAgent" }
    Automation:
      description: The settings.
      content:
        application/json:
          schema:
            type: object
            required: [autoAllow, followThrough]
            properties:
              autoAllow: { type: boolean }
              followThrough: { type: boolean }
    Goal:
      description: The goal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Goal" }
    GoalImage:
      description: The picture, without its bytes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GoalImage" }
    NightShift:
      description: The night shift's times.
      content:
        application/json:
          schema:
            type: object
            required: [start, report]
            properties:
              start: { type: string, example: "22:00" }
              report: { type: string, example: "07:00" }
    SelfRepair:
      description: The self-repair settings.
      content:
        application/json:
          schema:
            type: object
            required: [on, perNight]
            properties:
              on: { type: boolean }
              perNight: { type: integer, example: 3 }
    WhySettings:
      description: Whether a goal's agents get the why.
      content:
        application/json:
          schema:
            type: object
            required: [on]
            properties:
              on: { type: boolean }
    Races:
      description: The race settings.
      content:
        application/json:
          schema:
            type: object
            required: [pair, minPicks, conduits]
            properties:
              pair: { type: array, items: { type: string } }
              minPicks: { type: integer }
              conduits:
                type: array
                items:
                  type: object
                  required: [name, label, up]
                  properties:
                    name: { type: string }
                    label: { type: string }
                    up: { type: boolean }
    GoalStarted:
      description: The goal, and which agents started or were told.
      content:
        application/json:
          schema:
            type: object
            required: [goal, failed]
            properties:
              goal: { $ref: "#/components/schemas/Goal" }
              started: { type: array, items: { $ref: "#/components/schemas/Started" } }
              told: { type: array, items: { $ref: "#/components/schemas/Started" } }
              failed: { type: array, items: { type: string } }
    Agent:
      description: The agent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Agent" }
    Done:
      description: What was done, in words.
      content:
        application/json:
          schema:
            type: object
            required: [done]
            properties:
              done: { type: string }
    PullRequest:
      description: The pull request.
      content:
        application/json:
          schema:
            type: object
            required: [url, done]
            properties:
              url: { type: string }
              done: { type: string }
    Error:
      description: Refused, with why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    SessionSource:
      type: object
      required: [sessions, from]
      properties:
        sessions: { type: [array, "null"], items: { type: object } }
        error: { type: string }
        from: { type: string, description: Where it reads from, or off. }
    CloudSession:
      type: object
      description: A cloud session (Claude Code on the web) Sindri started. Times are epoch millis.
      required: [id, at, cwd, task, url]
      properties:
        id: { type: string, description: "session_…" }
        at: { type: integer }
        cwd: { type: string, description: The repo it was started from. }
        task: { type: string }
        url: { type: string, description: "https://claude.ai/code/session_…, which opens in the Claude app too." }
        pane: { type: string, description: The herdr pane it was started from. }
        lastSentAt: { type: integer }
        lastError: { type: string, description: Why the last message did not go. }
        teleportedAt: { type: integer }
    HerdrAgent:
      type: object
      required: [paneId, workspaceId, tabId, status, focused]
      properties:
        paneId: { type: string }
        workspaceId: { type: string }
        tabId: { type: string }
        name: { type: string }
        kind: { type: string }
        status: { type: string, enum: [idle, working, blocked, done, unknown] }
        cwd: { type: string }
        title: { type: string }
        sessionId: { type: string }
        focused: { type: boolean }
        pids: { type: array, items: { type: integer } }
        dialog: { type: string, enum: [permission, other] }
        dialogScreen: { type: object }
    Started:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        status: { type: string }
        project: { type: string }
        branch: { type: string }
    CodingAgent:
      type: object
      required: [primary]
      properties:
        primary: { type: string, enum: [claude, copilot] }
        engines:
          type: array
          description: The CLIs turned on here; COPILOT_BIN=off leaves copilot out, CLAUDE_BIN=off claude. Read only.
          items: { type: string, enum: [claude, copilot] }
    TaskView:
      type: object
      required: [id, at, session, goal, kind, project, branch, agent, partOf, outcome, result, endedAt, status, label, lastActivity, merged]
      properties:
        id: { type: integer }
        at: { type: integer }
        session: { type: string }
        goal: { type: string }
        kind: { type: string, enum: [code, ask] }
        project: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        agent: { type: string }
        partOf: { type: [integer, "null"] }
        goalId: { type: integer }
        outcome: { type: [string, "null"], enum: [done, no-changes, asked, failed, stopped, scheduled, null] }
        result: { type: [string, "null"] }
        endedAt: { type: [integer, "null"] }
        status: { type: string, enum: [needs-you, running, done, no-changes, failed, stopped, gone, scheduled] }
        label: { type: [string, "null"] }
        lastActivity: { type: integer }
        merged: { type: boolean }
        mergedAt: { type: integer, description: When the agent's branch merged; left out when it has not. }
    GoalImage:
      type: object
      required: [id, goal, at, name, mediaType, kind, note, bytes]
      properties:
        id: { type: integer }
        goal: { type: integer }
        at: { type: integer }
        name: { type: string }
        mediaType: { type: string }
        kind: { type: string, enum: [design, current] }
        note: { type: string }
        bytes: { type: integer }
    Goal:
      type: object
      required: [id, at, title, repos, source, context, session, images, state, tasks, next]
      properties:
        id: { type: integer }
        at: { type: integer }
        title: { type: string }
        repos: { type: array, items: { type: string } }
        source: { type: string, description: "Where the goal came from: manual, todo:…, linear:…, or self-repair:alert:<source>:<key> and self-repair:dispatch:<picked>><said> for self-repair goals." }
        context: { type: string }
        session: { type: string }
        closedAt: { type: [integer, "null"], description: When you closed the goal without merging it all; null while open. }
        night: { type: boolean, description: Whether the goal starts on its own tonight. Cleared when the night shift starts it. }
        images: { type: array, items: { $ref: "#/components/schemas/GoalImage" } }
        state: { type: string, enum: [draft, running, needs-you, done, merged, closed] }
        tasks: { type: array, items: { $ref: "#/components/schemas/GoalTask" } }
        race: { type: boolean, description: Whether the goal races at the night shift. }
        kind: { type: string, enum: [ui, bugfix, refactor, tests, docs, backend, other], description: "What kind of work it is, judged from its text: by Norn's local model, or a keyword guess until it has answered." }
        conduit: { type: string, description: "The conduit you chose for a normal run; empty is Sindri's default." }
        suggestion:
          type: object
          description: For a draft that does not race, the conduit that wins its kind most, once the kind has enough picks. A suggestion only.
          required: [conduit, kind, wins, picks]
          properties:
            conduit: { type: string }
            kind: { type: string }
            wins: { type: integer }
            picks: { type: integer }
        racing:
          type: object
          description: The race, once started.
          required: [pair, startedAt, lanes, ready, pick]
          properties:
            pair: { type: array, items: { type: string } }
            startedAt: { type: integer }
            ready: { type: boolean, description: Every lane has finished; the race waits for your pick. }
            pick:
              type: [object, "null"]
              description: Your pick, once made; null before.
              required: [at, goal, kind, pair, winner]
              properties:
                at: { type: integer }
                goal: { type: integer }
                kind: { type: string }
                pair: { type: array, items: { type: string } }
                winner: { type: string }
            lanes:
              type: array
              items:
                type: object
                required: [conduit, label, state, tasks]
                properties:
                  conduit: { type: string }
                  label: { type: string }
                  state: { type: string, enum: [draft, running, needs-you, done, merged] }
                  tasks: { type: array, items: { $ref: "#/components/schemas/GoalTask" } }
        raceNote: { type: string, description: Why a goal marked to race ran once instead. }
        why:
          type: object
          description: >-
            What the goal's agents were told about why it exists, from Norn's POST /v1/why when they started; absent
            before. A self-repair goal is never asked about.
          required: [at, state, sources]
          properties:
            at: { type: integer, description: When Norn was asked (or would have been), epoch ms. }
            state:
              type: string
              enum: [sent, none, unreachable, off]
              description: "sent: the sources went into the prompt; none: Norn found nothing it was sure of; unreachable: Norn did not answer in time, so the agents started without it; off: turned off, Norn was not asked."
            sources:
              type: array
              items:
                type: object
                required: [kind, at, summary, ref]
                properties:
                  kind: { type: string, enum: [mail, meeting, rewind] }
                  at: { type: integer }
                  summary: { type: string, description: One line from Norn's local model, names swapped for placeholders. }
                  ref: { type: string, description: Where Norn found it; never sent to the agent. }
        next:
          type: object
          required: [action, text]
          properties:
            action: { type: string, enum: [start, resume, answer, review, pick, none] }
            text: { type: string }
            repo: { type: string }
            agent: { type: string }
    GoalTask:
      type: object
      required: [id, repo, agent, status, label, branch, merged, lastActivity, result]
      properties:
        id: { type: integer }
        repo: { type: [string, "null"] }
        agent: { type: string }
        status: { type: string }
        label: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        merged: { type: boolean }
        lastActivity: { type: integer }
        result: { type: [string, "null"] }
        startedAt: { type: integer, description: When the task was handed to its agent (epoch ms). }
        mergedAt: { type: integer, description: When its branch merged (epoch ms); left out when it has not. }
    RacePick:
      type: object
      required: [at, goal, kind, pair, winner]
      properties:
        at: { type: integer }
        goal: { type: integer }
        kind: { type: string }
        pair: { type: array, items: { type: string } }
        winner: { type: string, description: The winning conduit, or neither. }
    Health:
      type: object
      required: [ok, part, version, startedAt, loops]
      properties:
        ok: { type: boolean }
        part: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        loops:
          type: object
          description: Each loop the part runs on a timer. Ratatoskr counts a loop as stalled when it has not run within three intervals and a minute.
          additionalProperties:
            type: object
            required: [everySeconds]
            properties:
              everySeconds: { type: integer }
              lastRunAt: { type: string, format: date-time }
              lastError: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LogEntry:
      type: object
      required: [at, kind, text]
      properties:
        at: { type: integer }
        kind: { type: string, enum: [prompt, text, tool, permission, result, error, exit] }
        text: { type: string }
    Agent:
      type: object
      required: [id, label, cwd, permissionMode, status, pending, startedAt, lastActivity, costUsd, numTurns, asksYou, resumable]
      properties:
        id: { type: string }
        label: { type: string }
        cwd: { type: string }
        permissionMode: { type: string, enum: [default, acceptEdits, plan, auto] }
        model: { type: string }
        status: { type: string, enum: [starting, working, needs-approval, waiting, done, failed, aborted] }
        tool: { type: string }
        lastText: { type: string }
        pending:
          type: array
          items:
            type: object
            required: [requestId, toolName, summary, at]
            properties:
              requestId: { type: string }
              toolName: { type: string }
              summary: { type: string }
              at: { type: integer }
              input: { type: object }
        startedAt: { type: integer }
        lastActivity: { type: integer }
        costUsd: { type: number }
        numTurns: { type: integer }
        engine: { type: string, enum: [copilot, opencode], description: Absent for Claude Code. }
        opencode:
          type: object
          description: An OpenCode agent's session.
          required: [directory]
          properties:
            sessionId: { type: string }
            directory: { type: string }
            promptedAt: { type: integer }
            seenBusy: { type: boolean }
        worktree:
          type: object
          required: [repo, path, branch, base, baseCommit]
          properties:
            repo: { type: string }
            path: { type: string }
            branch: { type: string }
            base: { type: string }
            baseCommit: { type: string }
        session: { type: string }
        asksYou: { type: boolean, description: The last turn ended on a question for you. }
        resumable: { type: boolean }
        lastError: { type: string }
        merged: { type: boolean }
        usageLimited: { type: boolean }
    Review:
      type: object
      required: [repo, path, branch, base, baseCommit, worktreeExists, branchExists, merged, conflicts, commits, files, diff, diffTruncated, uncommitted, checkout]
      properties:
        repo: { type: string }
        path: { type: string }
        branch: { type: string }
        base: { type: string }
        baseCommit: { type: string }
        worktreeExists: { type: boolean }
        branchExists: { type: boolean }
        merged: { type: boolean }
        conflicts: { type: array, items: { type: string } }
        commits:
          type: array
          items:
            type: object
            required: [hash, subject, at, merged]
            properties:
              hash: { type: string }
              subject: { type: string }
              at: { type: integer }
              merged: { type: boolean }
        files:
          type: array
          items:
            type: object
            required: [path, added, removed]
            properties:
              path: { type: string }
              added: { type: [integer, "null"] }
              removed: { type: [integer, "null"] }
        diff: { type: string }
        diffTruncated: { type: boolean }
        uncommitted: { type: array, items: { type: string } }
        checkout:
          type: object
          required: [branch, dirty]
          properties:
            branch: { type: string }
            dirty: { type: boolean }
        screenshots: { type: array, items: { type: object } }
    Check:
      type: object
      required: [kind, status, head, command, startedAt, output]
      properties:
        kind: { type: string, enum: [script, workflows] }
        script: { type: string }
        status: { type: string, enum: [running, passed, failed, unavailable] }
        head: { type: string }
        command: { type: string }
        startedAt: { type: integer }
        durationMs: { type: integer }
        exitCode: { type: integer }
        output: { type: string }
        reason: { type: string }
    Project:
      type: object
      required: [name, path, branch, docs]
      properties:
        name: { type: string }
        path: { type: string }
        branch: { type: [string, "null"] }
        docs: { type: boolean }
