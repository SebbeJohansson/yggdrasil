openapi: 3.1.0
info:
  title: Norn
  version: "1"
  description: |
    Yggdrasil's assistant: your inbox, calendars, sign-ins, memory, profile
    and writing help, and the front desk every message you type goes to
    first. Any program that serves this contract and passes
    `ygg check norn <url>` can replace the built-in one
    (docs/replacing-a-part.md).

    Rules a replacement must keep:
    - Learn only from your own words, never from an answer.
    - Never let a fact or a sentence name someone the source didn't.
    - Raw inbox text never leaves this part: Glim and the other parts get
      summaries only.
    - An expired sign-in is raised on Gjallar by Norn, the part holding it.
servers:
  - url: http://127.0.0.1:8771
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Alive, and when each loop last ran.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      summary: This contract.
      security: []
      responses:
        "200":
          description: The spec.
          content:
            application/yaml: {}
  /v1/memory:
    get:
      summary: Everything Norn remembers about you, newest first.
      responses:
        "200":
          description: The memories.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Memory" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Remember this. Saying it twice is not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Remembered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "200":
          description: Already known, by wording or by meaning.
          content:
            application/json:
              schema:
                type: object
                required: [known]
                properties:
                  known: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/memory/{id}:
    delete:
      summary: Forget one memory.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Forgotten.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/jokes:
    get:
      summary: The widget's jokes you rated, newest first.
      responses:
        "200":
          description: The ratings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [text, topic, form, rating, at]
                  properties:
                    text: { type: string }
                    topic: { type: [string, "null"] }
                    form: { type: [string, "null"] }
                    rating: { type: integer, enum: [1, -1] }
                    at: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/jokes/rating:
    post:
      summary: A thumb on a joke. Rating it again changes your mind; 0 takes it back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, rating]
              properties:
                text: { type: string, maxLength: 1000 }
                topic: { type: string }
                form: { type: string }
                rating: { type: integer, enum: [1, -1, 0] }
      responses:
        "200":
          description: Rated.
          content:
            application/json:
              schema:
                type: object
                required: [rated]
                properties:
                  rated: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/widgets:
    get:
      summary: Where this computer is, and what to hide at home and away. A hidden inbox source or calendar is not fetched at all.
      responses:
        "200": { $ref: "#/components/responses/WidgetSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Set them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WidgetSettings" }
      responses:
        "200": { $ref: "#/components/responses/WidgetSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/settings/promises:
    get:
      summary: Whether the promise ledger runs (on until you turn it off).
      responses:
        "200": { $ref: "#/components/responses/PromiseSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: >-
        Turn the promise ledger on or off. Off, Norn reads nothing you send or
        save for promises, writes no follow-ups and sends no reminders; kept
        promises stay listed and can still be changed. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/PromiseSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/send-names:
    get:
      summary: Until when names go to Claude as they are, without placeholders (Unix ms; 0 means they are swapped).
      responses:
        "200":
          description: Until when.
          content:
            application/json:
              schema:
                type: object
                required: [until]
                properties:
                  until: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Send names to Claude as they are for this many hours, for when the local model cannot look for them; 0 swaps them again. It turns itself back on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours: { type: number, minimum: 0, maximum: 24 }
      responses:
        "200":
          description: Until when.
          content:
            application/json:
              schema:
                type: object
                required: [until]
                properties:
                  until: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/conversations:
    get:
      summary: Every conversation, the most recent first, named by your first message in it.
      responses:
        "200":
          description: The conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [session, title, messages, started, last]
                  properties:
                    session: { type: string }
                    title: { type: [string, "null"] }
                    messages: { type: integer }
                    started: { type: integer }
                    last: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/search:
    get:
      summary: Turns holding that text, newest first, each with a snippet around the match. A plain substring match.
      parameters:
        - { name: q, in: query, required: true, example: secrets, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [session, title, role, author, label, at, snippet]
                  properties:
                    session: { type: string }
                    title: { type: [string, "null"] }
                    role: { type: string, enum: [user, assistant] }
                    author: { type: [string, "null"], description: The agent that said it; null for you and Norn. }
                    label: { type: [string, "null"] }
                    at: { type: integer }
                    snippet: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/chat/llm-calls:
    get:
      summary: The model calls each of your messages caused, with what was sent, the reply and the thinking. For the chat's debug view.
      parameters:
        - { name: session, in: query, required: true, example: s1, schema: { type: string, pattern: "^[\\w-]{1,64}$" } }
      responses:
        "200":
          description: Calls by message.
          content:
            application/json:
              schema:
                type: object
                required: [turns]
                properties:
                  turns:
                    type: array
                    items:
                      type: object
                      required: [turn, calls]
                      properties:
                        turn: { type: integer }
                        calls: { type: array, items: { $ref: "#/components/schemas/LlmCall" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/models/health:
    get:
      summary: Every model call of the last hours counted by hour and by purpose, failures sorted into kinds (json, timeout, unreachable, other), and the latest failures. For the System page.
      parameters:
        - { name: hours, in: query, required: false, example: 24, schema: { type: integer, minimum: 1, maximum: 72 } }
      responses:
        "200":
          description: Model health.
          content:
            application/json:
              schema:
                type: object
                required: [since, total, hours, purposes, recent, lastHour]
                properties:
                  since: { type: integer }
                  lastHour:
                    type: object
                    description: The last hour as Norn's alert judges it. Failures a retry without JSON mode made good do not count.
                    required: [calls, failed, failing]
                    properties:
                      calls: { type: integer }
                      failed: { type: integer }
                      failing: { type: boolean }
                  total: { $ref: "#/components/schemas/HealthCount" }
                  hours:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/HealthCount" }
                        - { type: object, required: [at], properties: { at: { type: integer } } }
                  purposes:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/HealthCount" }
                        - { type: object, required: [purpose, medianMs], properties: { purpose: { type: string }, medianMs: { type: integer } } }
                  recent:
                    type: array
                    items:
                      type: object
                      required: [at, purpose, backend, kind, error]
                      properties:
                        at: { type: integer }
                        purpose: { type: string }
                        backend: { type: string }
                        kind: { type: string, enum: [json, timeout, unreachable, other] }
                        error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/systemone:
    post:
      summary: Forwarded to Laya unchanged. Laya's key goes in X-Laya-Authorization, or Norn uses its own.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Laya's answer, as Laya gave it (any status).
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/write/check:
    post:
      summary: Spelling and grammar (LanguageTool), each line in its own language. Offsets are UTF-16 code units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WriteText" }
                - type: object
                  properties:
                    languages: { type: array, maxItems: 10, items: { type: string }, description: The writer's languages, primary first. }
      responses:
        "200":
          description: The issues found, and the language of most of the text.
          content:
            application/json:
              schema:
                type: object
                required: [language, issues]
                properties:
                  language: { type: string }
                  issues: { type: array, items: { $ref: "#/components/schemas/WriteIssue" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/write/tone:
    post:
      summary: The text's tone (Laya), from its last 1500 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteText" }
      responses:
        "200":
          description: The tone.
          content:
            application/json:
              schema:
                type: object
                required: [tone, probabilities]
                properties:
                  tone: { type: string, enum: [formal, friendly, casual, confident, frustrated] }
                  probabilities: { type: object, additionalProperties: { type: number } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/write/improve:
    post:
      summary: Clearer versions of the text's sentences, from a local model. It reads three new sentences per call; ask again for the pending ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteText" }
      responses:
        "200":
          description: The suggestions, and how many sentences wait.
          content:
            application/json:
              schema:
                type: object
                required: [issues, pending]
                properties:
                  issues: { type: array, items: { $ref: "#/components/schemas/WriteIssue" } }
                  pending: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/write/rewrite:
    post:
      summary: The text rewritten in a style, by a Claude agent with no tools that Sindri runs. Takes up to two minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WriteText" }
                - type: object
                  required: [style]
                  properties:
                    style: { type: string, enum: [clearer, shorter, formal, friendly, confident, english, swedish] }
      responses:
        "200":
          description: The rewritten text.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/activity:
    get:
      summary: Per day, your messages and agents' messages, with Sindri's sessions started, agents started and branches merged.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 800, default: 365 } }
      responses:
        "200":
          description: The days, keyed 2026-11-15 in the reader's time zone.
          content:
            application/json:
              schema:
                type: object
                required: [timeZone, days]
                properties:
                  timeZone: { type: string }
                  days:
                    type: object
                    additionalProperties:
                      type: object
                      required: [messages, agentMessages, sessions, agents, merges]
                      properties:
                        messages: { type: integer }
                        agentMessages: { type: integer }
                        sessions: { type: integer }
                        agents: { type: integer }
                        merges: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/microsoft:
    get:
      summary: The Microsoft sign-in (Teams, Outlook, the work calendar), and the calendar's last read.
      responses:
        "200": { $ref: "#/components/responses/Microsoft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/microsoft/sign-in:
    post:
      summary: Start a device-code sign-in, or get the code already waiting. Signed in with these scopes already, nothing happens unless force.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant: { type: string, pattern: "^[\\w.-]{1,100}$", description: A tenant id or domain; organizations by default. }
                mail: { type: boolean, description: Ask for Mail.Read. }
                calendar: { type: boolean, description: "Ask for Calendars.ReadWrite: Norn reads the calendar, and deletes your own copy of a meeting when you apply a calendar suggestion, and adds a break you keep free." }
                force: { type: boolean, description: Sign in again even though the scopes are held. }
      responses:
        "200": { $ref: "#/components/responses/Microsoft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/microsoft/token:
    post:
      summary: An access token for Graph, for the widget's own calls.
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresAt]
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: integer, description: Epoch ms. }
        "401":
          description: Not signed in to Microsoft, or a missing or wrong bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/microsoft/sign-out:
    post:
      summary: Forget the Microsoft sign-in.
      responses:
        "200": { $ref: "#/components/responses/Microsoft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/google:
    get:
      summary: The Google sign-in (Gmail, Google Calendar, Google Tasks), and the personal calendar's last read. off without a client configured.
      responses:
        "200": { $ref: "#/components/responses/Google" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/google/sign-in:
    post:
      summary: Start a sign-in. Answers the consent page to open; Google sends the browser back to localhost:42814.
      responses:
        "200": { $ref: "#/components/responses/Google" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/google/sign-out:
    post:
      summary: Forget the Google sign-in.
      responses:
        "200": { $ref: "#/components/responses/Google" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/calendar:
    get:
      summary: The work calendar, a day back to seven days ahead, read from Outlook every 2 minutes. Empty with at null when none is fresh.
      responses:
        "200": { $ref: "#/components/responses/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/calendar/suggestions:
    get:
      summary: >-
        Meetings you put in your work calendar yourself (you organize them,
        nobody else is invited) that an invite from someone else now covers:
        it overlaps in time and the subjects share a word or an emoji.
        duplicate when the invite is live, stale when the invite it matches was
        cancelled, or left the calendar while still ahead (remembered until
        Norn restarts). Only ones still ahead, up to 30 days (the calendar
        itself shows 7), without the ones you kept.
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/CalendarSuggestion" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/calendar/suggestions/{id}/apply:
    post:
      summary: Delete the suggestion's copy from Outlook (only a current suggestion's, so only a meeting you made with nobody else in it), then read the calendar again. Owner only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/calendar/suggestions/{id}/keep:
    post:
      summary: Keep your copy; it is not suggested again. Owner only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Kept.
          content:
            application/json:
              schema: { type: object, required: [kept], properties: { kept: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/calendar/breaks:
    post:
      summary: >-
        Keep a free slot free: a "Break" event in the work calendar (Outlook),
        shown as busy, nobody invited, with the Outlook category "Yggdrasil
        break" so Yggdrasil knows it as its own (break true on the calendar's
        events). 15 minutes to 2 hours, ending ahead, starting at most 7 days
        ahead. Reads the calendar first; 409 when something you did not
        decline (not all day, not shown as free) overlaps the slot. The same
        slot again answers 200 with the break already there. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start: { type: integer, description: Epoch ms. }
                end: { type: integer, description: Epoch ms. }
      responses:
        "200": { $ref: "#/components/responses/Break" }
        "201": { $ref: "#/components/responses/Break" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/calendar/personal:
    get:
      summary: The same from Google Calendar, with Google Tasks that have a due date. Empty while switched off where you are.
      responses:
        "200": { $ref: "#/components/responses/Calendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/events/stream:
    get:
      summary: |
        What just changed, as server-sent events, for parts that react to it
        (Huginn). Needs the token, so read it with fetch, not EventSource.
        Each event has an `id:`; reconnect with `Last-Event-ID` to get what
        you missed from the last 500, kept in memory only. Events carry
        summaries, never raw inbox text.

        - `event: inbox.arrived`, data InboxArrived: a poll found an item it
          had not seen before, ranked urgent or notable.
        - `event: draft.ready`, data DraftReady: Norn wrote a reply draft by
          itself for an inbox item (the drafts pass, not one you asked for).
        - `event: calendar.soon`, data CalendarChange: a meeting you did
          not decline starts within 30 minutes; once per meeting and start,
          and not for one already that close when Norn started.
        - `event: calendar.added`, data CalendarChange: a meeting that starts
          within the next 24 hours appeared.
        - `event: calendar.moved`, data CalendarChange with previousStart and
          previousEnd: its start or end changed.
        - `event: calendar.removed`, data CalendarChange: it is gone, or you
          declined it.
        - `event: calendar.ended`, data CalendarChange: its end has passed.
        - `event: calendar.duplicate`, data CalendarChange with invite: a
          meeting you put in your work calendar yourself is now covered by an
          invite (GET /v1/calendar/suggestions).
        - `event: calendar.stale`, data CalendarChange with invite: the
          invite your copy matches was cancelled.
        - `event: savepoint.ready`, data SavePoint: a meeting you kept your
          place through ended (GET /v1/savepoints). It carries your last
          prompt to Huginn, which tells the widget only.
        - `event: promise.due`, data PromiseDue: an open promise's day is
          the next working day (`by` tomorrow, or the weekday), or today
          when it was made too late for that. Once per promise and day.
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/inbox:
    get:
      summary: The inbox, collected and ranked here every two minutes (Slack on its own sweep), with its two one-line summaries, the sources' statuses, the mutes and the sign-ins.
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                type: object
                required: [items, justHidden, summary, fromModel, summaries, sources, at, graph, slack, judge, teams, mutes, signIn]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
                  justHidden: { type: array, items: { $ref: "#/components/schemas/Ranked" }, description: What a mute or a quiet chat just hid, said once. }
                  summary: { type: [string, "null"], description: The work section's sentence. }
                  fromModel: { type: boolean }
                  summaries:
                    type: object
                    required: [work, personal]
                    properties:
                      work: { $ref: "#/components/schemas/Summary" }
                      personal: { $ref: "#/components/schemas/Summary" }
                  sources: { type: array, items: { $ref: "#/components/schemas/SourceStatus" } }
                  at: { type: [integer, "null"] }
                  graph:
                    type: object
                    required: [step, at]
                    properties:
                      step: { type: [string, "null"], description: "What the poll is doing now: fetching, judging 3/12…" }
                      at: { type: [integer, "null"] }
                  slack:
                    type: object
                    required: [state, progress, at]
                    properties:
                      state: { type: string, enum: [off, pending, done, failed] }
                      progress:
                        type: [object, "null"]
                        required: [stage, done, total]
                        properties:
                          stage: { type: string, enum: [listing, details, history, threads, names] }
                          done: { type: integer }
                          total: { type: integer }
                      at: { type: [integer, "null"] }
                  error: { type: string }
                  judge: { type: [string, "null"], description: Who judged, or null for the four rules alone. }
                  teams: { type: array, items: { $ref: "#/components/schemas/Item" }, description: Every Teams item, hidden ones included, for the window's quiet check. }
                  mutes: { type: array, items: { $ref: "#/components/schemas/Mute" } }
                  signIn:
                    type: object
                    required: [slack, google]
                    properties:
                      slack: { $ref: "#/components/schemas/SlackStatus" }
                      google: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/inbox/refresh:
    post:
      summary: Poll now rather than at the next two minutes.
      responses:
        "202":
          description: Polling.
          content:
            application/json:
              schema:
                type: object
                required: [polling]
                properties:
                  polling: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/inbox/mutes:
    post:
      summary: Mute or unmute a chat. A muted chat's items are hidden unless they name you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, muted]
              properties:
                id: { type: string, maxLength: 300 }
                name: { type: string }
                muted: { type: boolean }
      responses:
        "200":
          description: Every mute.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Mute" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/inbox/quiet:
    post:
      summary: The chats Teams has gone quiet about, from the window's toasts. Hidden like mutes until the next call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chats]
              properties:
                chats: { type: array, maxItems: 1000, items: { type: string, maxLength: 300 } }
      responses:
        "204": { description: Noted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/inbox/feed:
    get:
      summary: The ranked items alone. Empty with at null when the inbox is stale (15 minutes).
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, at]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
                  total: { type: integer }
                  at: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/drafts:
    get:
      summary: Reply drafts kept for inbox items, newest first, for a week or until the message leaves the inbox (read, answered or deleted; only a source that read fine can say so). Norn drafts by itself for messages to you that ask something and are ranked urgent or notable (DRAFTS=false stops that). Never sent anywhere; you copy one into Teams, Slack or your mail.
      responses:
        "200":
          description: The drafts.
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Write a reply draft for an item in the inbox now, by the local model, replacing any draft it had. Takes a few seconds. `promise:<id>` drafts a follow-up on an open promise made in a message thread (GET /v1/promises).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item: { type: string, description: The inbox item's id. }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/drafts/{item}:
    delete:
      summary: Throw a draft away.
      parameters:
        - { name: item, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Thrown away. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/drafts/{item}/copied:
    post:
      summary: Keep the reply you copied from a draft (the widget's Copy), beside Norn's draft, to learn how you write. The draft stays until its message leaves the inbox. The last 500 are kept; never sent anywhere.
      parameters:
        - { name: item, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopiedReply" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/drafts/copied:
    get:
      summary: The replies you copied from drafts, newest first, with Norn's draft beside each.
      responses:
        "200":
          description: The replies.
          content:
            application/json:
              schema:
                type: object
                required: [replies]
                properties:
                  replies: { type: array, items: { $ref: "#/components/schemas/CopiedReply" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/promises:
    get:
      summary: >-
        The promise ledger: what you said you would do for someone, found by
        the local model in what you sent (Outlook Sent Items, Gmail Sent,
        your own last message in each Teams chat, your Slack messages the
        inbox sweep sees) and in the meeting notes you save on the dashboard.
        Only your own words; the text never leaves Norn, and is not kept:
        a promise is the model's short words for it. Messages from the last 3
        days are read, every 2 minutes. Once per message (or meeting) and
        text. Open ones by day, without a day last; done and dropped ones
        newest first, kept 60 days.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, done, dropped], default: open } }
      responses:
        "200":
          description: The promises.
          content:
            application/json:
              schema:
                type: object
                required: [promises]
                properties:
                  promises: { type: array, items: { $ref: "#/components/schemas/Promise" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/promises/{id}:
    patch:
      summary: Done, Drop, open again (a promise Norn marked done too) or change its day; a new day is reminded again. Owner only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: { type: string, enum: [open, done, dropped] }
                due: { type: string, description: "YYYY-MM-DD, or empty for no day." }
      responses:
        "200":
          description: The promise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/promises/{id}/dev:
    put:
      summary: Keep whether a promise is development work, as Huginn judges it (asking Norn with /local); the dashboard then offers to make it a goal. Never makes one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dev]
              properties:
                dev: { type: boolean }
      responses:
        "200":
          description: The promise.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/notes/meeting:
    get:
      summary: For a meeting, your Obsidian note for its day (when you wrote one) and the earlier meeting notes sharing a first name (yours left out) or a subject word with it, newest first. Titles and obsidian:// links only, never note text. The vault's root and Notes/Meetings are read. `on` is false without a vault (OBSIDIAN_VAULT).
      parameters:
        - { name: subject, in: query, required: true, example: Sprint review, schema: { type: string, maxLength: 300 } }
        - { name: start, in: query, required: false, example: 1794900000000, schema: { type: integer }, description: "Epoch ms; else the calendar's meeting with that subject." }
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                type: object
                required: [on, related]
                properties:
                  on: { type: boolean }
                  note: { $ref: "#/components/schemas/VaultNote" }
                  related: { type: array, items: { $ref: "#/components/schemas/VaultNote" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Add lines to the meeting's Obsidian note for its day, under "## Efter mötet", or make "<subject> - <YYYY-MM-DD>.md" at the vault's root when you have not written one. Your own text in the note is never changed. A new note starts with [[links]] to the notes in the vault's Resources folder it belongs to, picked from the subject, the attendees and your earlier notes' first lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, start, text]
              properties:
                subject: { type: string }
                start: { type: integer, description: Epoch ms. }
                attendees: { type: array, items: { type: string } }
                text: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Written.
          content:
            application/json:
              schema:
                type: object
                required: [note, made]
                properties:
                  note: { $ref: "#/components/schemas/VaultNote" }
                  made: { type: boolean, description: A new note; false when added to yours. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notes/meeting/live:
    put:
      summary: Keep the notes you are taking during a meeting in its Obsidian note for the day, under "## Under mötet", making "<subject> - <YYYY-MM-DD>.md" when there is none (with its Resources links first, as above). Each sitting (`id`) has a block of its own between two Markdown comments, rewritten with the whole text on every call; the rest of the note is never changed. Answers the note's title and link, never its text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, start, id, text]
              properties:
                subject: { type: string }
                start: { type: integer, description: Epoch ms. }
                attendees: { type: array, items: { type: string } }
                id: { type: string, pattern: "^[a-z0-9]{6,32}$", description: This sitting; a new one adds a block of its own. }
                text: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Written.
          content:
            application/json:
              schema:
                type: object
                required: [note, made]
                properties:
                  note: { $ref: "#/components/schemas/VaultNote" }
                  made: { type: boolean, description: A new note. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notes/meeting/actions:
    post:
      summary: Suggest the actions in the notes taken during a meeting, for you to approve before any goes to Linear. The local model reads the notes; they never leave the machine. Empty notes have no actions. `team` is the Linear team key an action goes to unless you pick another. The notes are also read for promises you made (GET /v1/promises), once per meeting (`start`) and promise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, text]
              properties:
                subject: { type: string }
                start: { type: integer, description: "The meeting's start, epoch ms: the promise ledger keeps a promise once per meeting." }
                attendees: { type: array, items: { type: string } }
                text: { type: string, maxLength: 20000 }
            example: { subject: "Budget", text: "" }
      responses:
        "200":
          description: The suggested actions, at most 8.
          content:
            application/json:
              schema:
                type: object
                required: [actions, team]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [title, description]
                      properties:
                        title: { type: string, description: A short imperative in the notes' language. }
                        description: { type: string, description: The context from the notes. }
                  team: { type: string, example: AI }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/linear/teams:
    get:
      summary: The Linear teams an issue can be made in, and the key of the one meeting actions go to by default. `on` is false, and the list empty, without LINEAR_KEY.
      responses:
        "200":
          description: The teams, by name.
          content:
            application/json:
              schema:
                type: object
                required: [on, teams, team]
                properties:
                  on: { type: boolean }
                  teams:
                    type: array
                    items:
                      type: object
                      required: [id, key, name]
                      properties:
                        id: { type: string }
                        key: { type: string, example: AI }
                        name: { type: string, example: AI engineering }
                  team: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/linear/issues:
    post:
      summary: Make a Linear issue assigned to you in the team with key `team`, from an action you approved. With `meeting`, the issue is also linked under "## Åtgärder" in that meeting's Obsidian note for its day (made when there is none); the issue is made even when the note cannot be written, and `noteError` says why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team, title]
              properties:
                team: { type: string, example: AI }
                title: { type: string, maxLength: 250 }
                description: { type: string, maxLength: 10000 }
                meeting:
                  type: object
                  required: [subject, start]
                  properties:
                    subject: { type: string }
                    start: { type: integer, description: Epoch ms. }
                    attendees: { type: array, items: { type: string } }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema:
                type: object
                required: [identifier, title, url]
                properties:
                  identifier: { type: string, example: AI-142 }
                  title: { type: string }
                  url: { type: string }
                  note: { $ref: "#/components/schemas/VaultNote" }
                  noteError: { type: string, description: Why the meeting's note did not get the link. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/meetings/prep:
    get:
      summary: How a meeting's brief is written, kept per recurring series so every occurrence shares it. Empty prompt and model when nothing is kept.
      parameters:
        - { name: key, in: query, required: true, example: "series:AAMkAD", schema: { type: string } }
      responses:
        "200":
          description: The prep.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingPrep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Keep how a meeting's (series') brief is written. A prompt and model both empty removes it. Huginn's meeting briefs ask with the prompt, and with Claude when the model is claude; Norn reads the invitation, email and Teams chats itself and gives them to a Claude agent with no tools, names swapped for placeholders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeetingPrep" }
      responses:
        "200":
          description: Kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeetingPrep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/savepoints:
    get:
      summary: >-
        Save points, newest first. When a meeting starts (not declined, not all
        day, not shown as free, not a break you kept free), Norn keeps what you
        were doing: the open goal (Sindri) and your own Claude Code session
        that moved last within 30 minutes, with your last prompt there clipped
        to 200 characters. Nothing is kept when nothing moved. When the meeting
        ends, readyAt is set and savepoint.ready goes out on the event stream.
        Kept on this machine only; nothing here goes to Claude.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: The save points.
          content:
            application/json:
              schema:
                type: object
                required: [savepoints]
                properties:
                  savepoints: { type: array, items: { $ref: "#/components/schemas/SavePoint" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/savepoints/{id}/done:
    post:
      summary: Put a save point away (the dashboard's Pick up or Not now). Saying it twice keeps the first doneAt. Owner only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Put away.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavePoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/inbox/summary:
    post:
      summary: Phrase a sentence for ranked items the caller collected. Never fails because of the model; falls back to the plain count, as it does when the model names someone the items don't hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [top, total]
              properties:
                top: { type: array, items: { $ref: "#/components/schemas/Ranked" } }
                total: { type: integer, minimum: 0 }
                now: { type: integer, description: Epoch ms. }
                scope: { type: string, enum: [work, personal] }
      responses:
        "200":
          description: The sentence.
          content:
            application/json:
              schema:
                type: object
                required: [text, fromModel]
                properties:
                  text: { type: string }
                  fromModel: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/slack/sign-in:
    post:
      summary: Start a Slack sign-in with your Slack app. Answers the page to open; Slack sends the browser back to localhost:42813.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string, pattern: "^[\\d.]{5,40}$" }
      responses:
        "200":
          description: The sign-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlackStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/slack/sign-out:
    post:
      summary: Forget the Slack sign-in.
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlackStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/ask:
    post:
      summary: A message. Norn answers it itself, or hands it to Sindri (a question that needs tools, a coding task, a reply to an agent). An answer has no fallback worth sending, so a model that fails is a 502.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 4000 }
                session: { type: string, pattern: "^[\\w-]{1,64}$" }
                to: { type: string, description: "norn, or an agent id: who it goes to, picked by hand." }
                images: { type: array, maxItems: 5, items: { type: string } }
                communication: { type: string, enum: [concise, detailed, verbose] }
                mode: { type: string, enum: [auto, manual] }
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [answer, session, recalled, usedInbox, via]
                properties:
                  answer: { type: string }
                  session: { type: string }
                  recalled: { type: array, items: { $ref: "#/components/schemas/Memory" } }
                  usedInbox: { type: boolean }
                  via: { type: string, description: "What handled it: dispatcher: delegate, rule: approval, local model…" }
                  delegated:
                    type: object
                    required: [agentId, status]
                    properties:
                      agentId: { type: string }
                      status: { type: string }
                      project: { type: string }
                      branch: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /v1/chat:
    get:
      summary: One conversation as the chat shows it, the agents in it, and who "to:" should point at now.
      parameters:
        - { name: session, in: query, required: true, example: s1, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, description: Only turns after this id. } }
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                type: object
                required: [messages, participants, to, projects]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [id, role, content, at, author, label, decision, via]
                      properties:
                        id: { type: integer }
                        role: { type: string, enum: [user, assistant] }
                        content: { type: string }
                        at: { type: integer }
                        author: { type: [string, "null"] }
                        label: { type: [string, "null"] }
                        decision: { type: [integer, "null"] }
                        via: { type: [string, "null"] }
                  participants: { type: array, items: { type: object, required: [id, label, place, status, asksYou] } }
                  to: { type: string }
                  projects: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/conversations/{session}/agent-turns:
    post:
      summary: Sindri posts what an agent said into the conversation it works for (with agent), or a line of its own (without). Only the caller named sindri may.
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                agent: { type: string }
                label: { type: string }
                content: { type: string }
      responses:
        "201":
          description: Posted.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not Sindri.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/needs-you:
    get:
      summary: Everything waiting on you across every conversation, oldest first. An approval or question, a failed or finished result you have not read, a branch ready to review, an agent gone silent.
      responses:
        "200":
          description: The needs.
          content:
            application/json:
              schema:
                type: object
                required: [needs]
                properties:
                  needs:
                    type: array
                    items:
                      type: object
                      required: [kind, agent, label, session, text, at]
                      properties:
                        kind: { type: string, enum: [approval, question, failed, result, stuck, ready] }
                        agent: { type: string }
                        label: { type: string }
                        session: { type: [string, "null"] }
                        text: { type: [string, "null"] }
                        pending: { type: object }
                        reviewable: { type: boolean }
                        running: { type: boolean }
                        at: { type: integer }
                        overdue: { type: boolean }
                        check: { type: string, enum: [running, passed, failed] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/needs-you/read:
    post:
      summary: You have read what that agent said.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent]
              properties:
                agent: { type: string }
      responses:
        "200":
          description: Whether anything was unread.
          content:
            application/json:
              schema:
                type: object
                required: [read]
                properties:
                  read: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/decisions:
    get:
      summary: Every dispatch decision, newest first, beside the shadow Laya's pick and your corrections, with a summary over all of them. The training data for a better dispatcher.
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: The summary over every decision, and the latest decisions.
          content:
            application/json:
              schema:
                type: object
                required: [summary, decisions]
                properties:
                  summary:
                    type: object
                    required: [decisions, shadowed, agree, corrected, shadowRightOnCorrected, shadowedCorrected, medianMs]
                    properties:
                      decisions: { type: integer }
                      shadowed: { type: integer }
                      agree: { type: integer }
                      corrected: { type: integer }
                      shadowRightOnCorrected: { type: integer }
                      shadowedCorrected: { type: integer }
                      medianMs: { type: object, properties: { live: { type: [integer, "null"] }, shadow: { type: [integer, "null"] } } }
                  decisions:
                    type: array
                    items:
                      type: object
                      required: [id, at, message, source, live, guards, ms, shadow, correction, agrees, shadowRight, liveRef, shadowRef]
                      properties:
                        id: { type: integer }
                        at: { type: integer }
                        message: { type: string }
                        source: { type: string, enum: [model, fallback, person] }
                        live: { type: object, required: [action, target], properties: { action: { type: string, enum: [answer, delegate, code, reply, status] }, target: { type: [string, "null"] } } }
                        beforeGuards: { type: object, required: [action, target], properties: { action: { type: string, enum: [answer, delegate, code, reply, status] }, target: { type: [string, "null"] } } }
                        guards: { type: array, items: { type: string } }
                        ms: { type: [integer, "null"] }
                        shadow: { type: [object, "null"], description: "The shadow's pick, with ms and confidence." }
                        correction: { type: [object, "null"], description: "{ action, target, at }: where you said it belonged." }
                        agrees: { type: [boolean, "null"] }
                        shadowRight: { type: [boolean, "null"] }
                        liveRef: { type: [string, "null"], description: The live pick as the correction route takes it. }
                        shadowRef: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/decisions/{id}/correction:
    post:
      summary: Where a message belonged, kept as the training label. With redo, the message is also sent there now, and the answer comes back as /v1/ask's.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, description: "answer, delegate, code:<project>, reply_to_agent:<agent id> or status:<agent id>." }
                redo: { type: boolean }
      responses:
        "200":
          description: Corrected; with redo, also the answer.
          content:
            application/json:
              schema: { type: object, required: [corrected], properties: { corrected: { type: integer } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A named token. `owner` is you; any other name is a part.
  responses:
    PromiseSettings:
      description: Whether the promise ledger runs.
      content:
        application/json:
          schema:
            type: object
            required: [on]
            properties:
              on: { type: boolean }
    Microsoft:
      description: The sign-in.
      content:
        application/json:
          schema:
            type: object
            required: [state, calendar]
            properties:
              state: { type: string, enum: [signed-out, linking, signed-in, error] }
              code:
                type: object
                description: While linking, what to type and where. Never the device code itself.
                required: [userCode, verificationUri, expiresAt]
                properties:
                  userCode: { type: string }
                  verificationUri: { type: string }
                  expiresAt: { type: integer }
              error: { type: string }
              scopes:
                type: object
                required: [mail, calendar]
                properties:
                  mail: { type: boolean }
                  calendar: { type: boolean }
              calendar: { $ref: "#/components/schemas/CalendarRead" }
    Google:
      description: The sign-in.
      content:
        application/json:
          schema:
            type: object
            required: [state, calendar]
            properties:
              state: { type: string, enum: [off, signed-out, waiting, signed-in, error] }
              authorizeUrl: { type: string, description: While waiting, the consent page to open. }
              grants:
                type: object
                required: [gmail, calendar, tasks]
                properties:
                  gmail: { type: boolean }
                  calendar: { type: boolean }
                  tasks: { type: boolean }
              error: { type: string }
              calendar: { $ref: "#/components/schemas/CalendarRead" }
    Break:
      description: The break, as the calendar shows it.
      content:
        application/json:
          schema:
            type: object
            required: [event]
            properties:
              event: { $ref: "#/components/schemas/CalendarEvent" }
    Calendar:
      description: The calendar.
      content:
        application/json:
          schema:
            type: object
            required: [events, from, to, at]
            properties:
              events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
              tasks:
                type: array
                items:
                  type: object
                  required: [title, due]
                  properties:
                    title: { type: string }
                    due: { type: string, description: YYYY-MM-DD. Google keeps no time of day. }
                    list: { type: string }
                    notes: { type: string }
                    link: { type: string }
              from: { type: [integer, "null"] }
              to: { type: [integer, "null"] }
              at: { type: [integer, "null"], description: When it was read; null when there is no fresh read. }
    WidgetSettings:
      description: The settings.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WidgetSettings" }
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Only the owner may do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible yet; the message says what to do (usually sign in again).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Something Norn relies on did not answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: Turned off here; the message says what to set.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Draft:
      type: object
      required: [item, source, text, auto, at, checked]
      properties:
        item: { type: string, description: "The inbox item it answers, or promise:<id> for a follow-up on a promise whose day has come." }
        source: { type: string, enum: [outlook, teams, slack, gmail] }
        text: { type: string }
        tone: { type: string, description: How it reads, by Laya; unset when Laya did not answer. }
        auto: { type: boolean, description: Norn wrote it by itself, rather than on request. }
        checked: { type: boolean, description: A second pass checked every sentence against the message, the calendar and your notes. }
        dropped: { type: array, items: { type: string }, description: The sentences that pass took out, as nothing backed them up. }
        at: { type: integer }
    WriteText:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
    WriteIssue:
      type: object
      required: [offset, length, message, replacements, kind, source]
      properties:
        offset: { type: integer, description: In UTF-16 code units. }
        length: { type: integer }
        message: { type: string }
        replacements: { type: array, items: { type: string } }
        kind: { type: string, enum: [spelling, grammar, style, clarity] }
        source: { type: string, enum: [languagetool, ollama] }
        rule: { type: string }
    Health:
      type: object
      required: [ok, part, version, startedAt, loops]
      properties:
        ok: { type: boolean }
        part: { type: string }
        version: { type: string }
        startedAt: { type: string, format: date-time }
        loops:
          type: object
          description: Each loop the part runs on a timer. Ratatoskr counts a loop as stalled when it has not run within three intervals and a minute.
          additionalProperties:
            type: object
            required: [everySeconds]
            properties:
              everySeconds: { type: integer }
              lastRunAt: { type: string, format: date-time }
              lastError: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Memory:
      type: object
      required: [id, text, source, at]
      properties:
        id: { type: integer }
        text: { type: string }
        source: { type: string, enum: [extracted, manual] }
        at: { type: integer }
    WidgetSettings:
      type: object
      required: [place, hideAtHome, hideAway]
      properties:
        place: { type: string, enum: [home, away, unknown] }
        hideAtHome: { $ref: "#/components/schemas/Features" }
        hideAway: { $ref: "#/components/schemas/Features" }
    Features:
      type: array
      items: { type: string, enum: [agents, inbox, ask, teams, slack, outlook, outlook-calendar, gmail, google-calendar] }
    CalendarRead:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [off, pending, ok, refused] }
        error: { type: string }
    CalendarEvent:
      type: object
      required: [subject, start, end, allDay, online]
      properties:
        subject: { type: string }
        start: { type: integer, description: Epoch ms. }
        end: { type: integer }
        allDay: { type: boolean }
        location: { type: string }
        organizer: { type: string, description: Left out when you organize it. }
        response: { type: string, enum: [accepted, tentativelyAccepted, declined, notResponded, organizer, none] }
        showAs: { type: string }
        online: { type: boolean }
        id: { type: string, description: The same meeting keeps the same id when it moves. }
        attendees: { type: array, items: { type: string }, description: "Who is invited, by name (or address), at most 30. Google leaves you out; Outlook lists you too." }
        series: { type: string, description: "The recurring meeting it is one of, the same for every occurrence; left out for a one-off." }
        rooms: { type: array, items: { type: string }, description: "The rooms booked for it, by name; left out when none." }
        join: { type: string, description: "Its Teams or Google Meet link: the calendar's own, else the first in the invitation's text; left out when none." }
        break: { type: boolean, description: "A break kept free with POST /v1/calendar/breaks (Outlook category \"Yggdrasil break\"), not a meeting; left out otherwise. No calendar.* events are sent for it." }
    VaultNote:
      type: object
      required: [path, title, link]
      properties:
        path: { type: string, description: In the vault, with the .md. }
        title: { type: string }
        date: { type: string, description: The YYYY-MM-DD ending the title. }
        link: { type: string, description: obsidian://open for it. }
        why: { type: array, items: { type: string }, description: The first names and subject words it shares with the meeting. }
    CopiedReply:
      type: object
      required: [at, item, source, draft, sent]
      properties:
        at: { type: integer }
        item: { type: string }
        source: { type: string }
        relation: { type: string }
        draft: { type: string, description: Norn's draft. }
        sent: { type: string, description: What you copied. }
    Promise:
      type: object
      required: [id, what, to, state, source, message, thread, createdAt, changedAt]
      properties:
        id: { type: integer }
        what: { type: string, description: "What you will do, in the local model's short words (\"Send the Q3 deck\")." }
        to: { type: string, description: Who it was promised to, as Norn knows them; empty when unclear. }
        toAddress: { type: string, description: Their email address, or Teams or Slack user id, when known. }
        due: { type: string, description: "The day, YYYY-MM-DD in TIME_ZONE, from the words you used (\"Friday\", \"i morgon\"); unset when none was said or it was vague." }
        state: { type: string, enum: [open, done, dropped] }
        source: { type: string, enum: [outlook, gmail, teams, slack, meeting] }
        message: { type: string, description: "The message's id (outlook:…, gmail:…, teams:<chat>:<message>, slack:<channel>:<ts>), or meeting:<start>:<hash>." }
        link: { type: string, description: Where the message opens. }
        subject: { type: string }
        thread: { type: boolean, description: Made in a message thread; only then is a follow-up drafted. }
        createdAt: { type: integer }
        changedAt: { type: integer }
        doneBy: { type: string, enum: [you, norn], description: "norn when a later message of yours to the same person kept it, as the local model judged (strictly)." }
        doneWhy: { type: string, description: What in that message kept it. }
        doneLink: { type: string, description: Where that message opens. }
        remindedAt: { type: integer, description: When promise.due went out for it. }
        dev: { type: boolean, description: Huginn's judgement that it is development work; unset until judged. }
    PromiseDue:
      type: object
      required: [id, what, to, due, by, source, draft, dev, at]
      description: A promise whose day has come, without the message it was made in.
      properties:
        id: { type: integer }
        what: { type: string }
        to: { type: string }
        due: { type: string, description: YYYY-MM-DD. }
        by: { type: string, description: "How the day reads: tomorrow, today, or a weekday (Monday) when the next working day is further." }
        source: { type: string, enum: [outlook, gmail, teams, slack, meeting] }
        draft: { type: boolean, description: "A follow-up draft waits on the dashboard (GET /v1/drafts, item promise:<id>)." }
        dev: { type: boolean }
        link: { type: string, description: The dashboard's promises. }
        at: { type: integer }
    DraftReady:
      type: object
      required: [id, source, from, band, direct, mentionsMe, at]
      description: The inbox item a reply draft was written for, without its text or the draft's.
      properties:
        id: { type: string }
        source: { type: string, enum: [outlook, teams, slack, gmail] }
        from: { type: string }
        relation: { type: string, enum: [manager, above, leadership, report, peer] }
        band: { type: string }
        direct: { type: boolean }
        mentionsMe: { type: boolean }
        tone: { type: string, description: How the draft reads, by Laya. }
        link: { type: string }
        at: { type: integer, description: When the draft was written, epoch ms. }
    InboxArrived:
      type: object
      required: [id, source, from, band, reasons, direct, mentionsMe, summary, at]
      description: An inbox item without its text. Raw text never leaves Norn.
      properties:
        id: { type: string }
        source: { type: string, enum: [outlook, teams, slack, gmail] }
        from: { type: string }
        relation: { type: string, enum: [manager, above, leadership, report, peer] }
        band: { type: string, enum: [urgent, notable] }
        reasons: { type: array, items: { type: string } }
        direct: { type: boolean }
        mentionsMe: { type: boolean }
        summary: { type: string, description: One line written by Norn. }
        conversation: { type: string }
        link: { type: string }
        at: { type: integer, description: Epoch ms. }
    CalendarChange:
      type: object
      required: [calendar, event]
      properties:
        calendar: { type: string, enum: [work, personal] }
        event: { $ref: "#/components/schemas/CalendarEvent" }
        previousStart: { type: integer, description: Epoch ms; calendar.moved only. }
        previousEnd: { type: integer }
        prompt: { type: string, description: "What you add to this meeting's brief prompt (kept per series, /v1/meetings/prep); on calendar.soon, .added and .moved, left out when none." }
        model: { type: string, enum: [local, claude], description: "What writes this meeting's brief (kept per series); with claude, Huginn asks a Claude agent. Left out when never picked." }
        invite: { $ref: "#/components/schemas/CalendarEvent", description: "The invite covering your copy (event); on calendar.duplicate and .stale only." }
    CalendarSuggestion:
      type: object
      required: [id, kind, copy, invite]
      properties:
        id: { type: string, description: Short and stable for the copy. }
        kind: { type: string, enum: [duplicate, stale] }
        copy: { $ref: "#/components/schemas/CalendarEvent" }
        invite: { $ref: "#/components/schemas/CalendarEvent" }
    SavePoint:
      type: object
      required: [id, at, meeting, meetingId, meetingStart, meetingEnd, title, link, goal, session, readyAt, doneAt]
      properties:
        id: { type: integer }
        at: { type: integer, description: When it was kept, the meeting's start (epoch ms). }
        meeting: { type: string, description: The meeting's subject. }
        meetingId: { type: string }
        meetingStart: { type: integer }
        meetingEnd: { type: integer, description: On savepoint.ready, the end as the calendar last said. }
        title: { type: string, description: The goal's or the session's title, whichever moved last. }
        link: { type: string, description: "The dashboard path that picks it up: /dashboard/goals/<id>, else /dashboard/sessions/<id>?dir=…&name=…" }
        goal:
          type: [object, "null"]
          required: [id, title, lastActivity]
          properties:
            id: { type: integer }
            title: { type: string }
            lastActivity: { type: integer }
        session:
          type: [object, "null"]
          required: [id, title, lastActivity]
          properties:
            id: { type: string }
            title: { type: string }
            cwd: { type: string }
            project: { type: string }
            branch: { type: string }
            lastPrompt: { type: string, maxLength: 200, description: Your last prompt in it, clipped. }
            lastActivity: { type: integer }
        readyAt: { type: [integer, "null"], description: When its meeting ended and it was handed back. }
        doneAt: { type: [integer, "null"], description: When you put it away. }
    MeetingPrep:
      type: object
      required: [key, prompt, model]
      properties:
        key: { type: string, description: "series:<series> for a recurring meeting, else event:<id>." }
        prompt: { type: string, maxLength: 500, description: What you add to the brief's prompt. }
        model: { type: string, enum: ["", local, claude], description: What writes the brief; empty when you never picked. }
    Item:
      type: object
      required: [id, source, from, subject, preview, at, direct, mentionsMe, important]
      properties:
        id: { type: string }
        source: { type: string, enum: [outlook, teams, slack, gmail] }
        from: { type: string }
        sender: { type: string }
        relation: { type: string, enum: [manager, above, leadership, report, peer] }
        recipients: { type: array, items: { type: string } }
        subject: { type: string }
        preview: { type: string }
        context: { type: string }
        at: { type: integer }
        direct: { type: boolean }
        mentionsMe: { type: boolean }
        important: { type: boolean }
        conversation: { type: string }
        hidden: { type: string, description: Why it never reaches the panel. }
        link: { type: string }
    Ranked:
      type: object
      required: [item, score, band, reasons]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        score: { type: number }
        band: { type: string, enum: [urgent, notable, quiet, hidden] }
        reasons: { type: array, items: { type: string } }
        judgement:
          type: object
          required: [awaited, consequence, confidence]
          properties:
            awaited: { type: number }
            consequence: { type: number }
            confidence: { type: number }
    Summary:
      type: object
      required: [text, fromModel]
      properties:
        text: { type: [string, "null"] }
        fromModel: { type: boolean }
    SourceStatus:
      type: object
      required: [source, ok, count]
      properties:
        source: { type: string, enum: [outlook, teams, slack, gmail] }
        ok: { type: boolean }
        count: { type: integer }
        error: { type: string }
    Mute:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SlackStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [signed-out, waiting, signed-in, error] }
        authorizeUrl: { type: string }
        handle: { type: string }
        error: { type: string }
    HealthCount:
      type: object
      required: [calls, failed, ollama]
      properties:
        calls: { type: integer }
        failed: { type: integer }
        ollama: { type: integer, description: Calls Ollama answered because XeStrata did not. }
        kinds: { type: [object, "null"], additionalProperties: { type: integer } }
    LlmCall:
      type: object
      required: [at, session, exchange, purpose, backend, model, totalMs]
      properties:
        at: { type: integer }
        session: { type: [string, "null"] }
        exchange: { type: [integer, "null"] }
        purpose: { type: string }
        backend: { type: string, enum: [xestrata, ollama, claude], description: "claude is a handover to a Claude agent through Sindri, or its answer coming back: model then says how." }
        model: { type: string }
        promptTokens: { type: [integer, "null"] }
        cachedTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        promptMs: { type: [number, "null"] }
        outputMs: { type: [number, "null"] }
        totalMs: { type: integer }
