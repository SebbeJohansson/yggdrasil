# The parts that run in containers. Sindri, Veðrfölnir and Ratatoskr run on
# the host as systemd user units (deploy/systemd): Sindri's agents need your
# repos and toolchain, Veðrfölnir has to see /proc, systemd and docker, and
# Ratatoskr must not go down with a broken `compose up`.
#
# Each part has a profile, so a machine starts only what it needs:
# COMPOSE_PROFILES=gjallar,munin in .env (see .env.example).
#
# Host networking, so 127.0.0.1 in here is 127.0.0.1 on this machine: the
# parts listen on loopback only and reach each other there.
x-part: &part
  build: .
  image: yggdrasil
  restart: unless-stopped
  network_mode: host

services:
  norn:
    <<: *part
    profiles: [norn]
    command: [norn]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/norn.env
    environment:
      NORN_DB: /data/norn.db
      PROFILE_PATH: /profile/profile.md
    volumes:
      # The database and the sign-ins (Microsoft, Google, Slack), beside it.
      - ./data:/data
      - ./profile:/profile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8771/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  gjallar:
    <<: *part
    profiles: [gjallar]
    command: [gjallar]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/gjallar.env
    environment:
      GJALLAR_DB: /data/gjallar.db
    volumes:
      # A plain folder, so the database is easy to find, back up, or open with sqlite3.
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8774/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  munin:
    <<: *part
    profiles: [munin]
    command: [munin]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/munin.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8776/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  huginn:
    <<: *part
    profiles: [huginn]
    command: [huginn]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/huginn.env
    environment:
      HUGINN_DB: /data/huginn.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8777/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  dellingr:
    <<: *part
    profiles: [dellingr]
    command: [dellingr]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/dellingr.env
    environment:
      DELLINGR_DB: /data/dellingr.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8778/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  hermodr:
    <<: *part
    profiles: [hermodr]
    command: [hermodr]
    env_file:
      - path: ${HOME}/.config/yggdrasil/parts.env
        required: false
      - ${HOME}/.config/yggdrasil/hermodr.env
    environment:
      HERMODR_DB: /data/hermodr.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8779/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Spelling and grammar for Norn's writing checks, with exact offsets, fast
  # enough to check as you type. Not a part, so not in dev mode: it keeps
  # running while Norn runs from source.
  languagetool:
    profiles: [languagetool]
    # Built from the official release zip (../pennvass/docker/languagetool).
    build: ../pennvass/docker/languagetool
    image: pennvass-languagetool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"

  # Dev mode for the container parts (scripts/dev-mode.sh on): Norn, Gjallar,
  # Munin, Huginn, Dellingr and Hermóðr from your working tree, rebuilt and
  # restarted on every save by scripts/dev.sh. Stop their containers above first;
  # dev-mode.sh does.
  # The repo, its data and your settings are mounted at their host paths, so
  # the parts find the same files a `scripts/dev.sh` on the host would.
  dev:
    profiles: [dev]
    build:
      dockerfile_inline: |
        FROM golang:1.25-alpine
        RUN apk add --no-cache git
    image: yggdrasil-dev
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    working_dir: ${HOME}/projects/yggdrasil
    command: ["scripts/dev.sh", "norn", "gjallar", "munin", "huginn", "dellingr", "hermodr"]
    environment:
      HOME: ${HOME}
      YGG_DEV_MANAGED: "1"
      YGG_GO: go
      YGG_DEV_DIR: bin/dev-container
      GOMODCACHE: /gomod
      GOCACHE: /gocache
      CGO_ENABLED: "0"
    volumes:
      - .:${HOME}/projects/yggdrasil
      - ${HOME}/.config/yggdrasil:${HOME}/.config/yggdrasil:ro
      - ${HOME}/go/pkg/mod:/gomod
      - ${HOME}/.cache/go-build:/gocache
